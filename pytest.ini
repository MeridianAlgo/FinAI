[pytest]
markers =
    slow: marks tests as slow (network/downloads)

filterwarnings =
    ignore::FutureWarning
    ignore::DeprecationWarning

python_files = test_*.py

# Run tests in verbose streaming mode (-s) and quiet pytest output (-q)
addopts = -q -s

# Limit test discovery to the `tests/` directory so pytest won't collect
# legacy scripts or root files that start with `test_`.
testpaths = tests
