# Hugging Face Datasets Configuration
# Fin.AI cycles through these datasets every 1.5 hours
# All datasets are < 5GB and optimized for quality training

datasets:
  # 0 - Wikipedia Small
  - name: "wikitext"
    subset: "wikitext-2-raw-v1"
    split: "train"
    text_column: "text"
    
  # 1 - TinyStories (Creative Writing)
  - name: "roneneldan/TinyStories"
    subset: null
    split: "train"
    text_column: "text"
    max_samples: 30000
    
  # 2 - Math Reasoning (GSM8K)
  - name: "openai/gsm8k"
    subset: "main"
    split: "train"
    text_column: "question"
    
  # 3 - SQuAD Q&A
  - name: "squad"
    subset: null
    split: "train"
    text_column: "context"
    max_samples: 50000
    
  # 4 - IMDB Reviews
  - name: "imdb"
    subset: null
    split: "train"
    text_column: "text"
    max_samples: 25000
    
  # 5 - AG News
  - name: "ag_news"
    subset: null
    split: "train"
    text_column: "text"
    
  # 6 - Yelp Reviews
  - name: "yelp_review_full"
    subset: null
    split: "train"
    text_column: "text"
    max_samples: 50000
    
  # 7 - BookCorpus (Books)
  - name: "bookcorpus"
    subset: null
    split: "train"
    text_column: "text"
    max_samples: 30000
    streaming: true
    
  # 8 - ELI5 (Explanations)
  - name: "eli5"
    subset: null
    split: "train"
    text_column: "answers.text"
    max_samples: 20000
    
  # 9 - Scientific Papers
  - name: "scientific_papers"
    subset: "arxiv"
    split: "train"
    text_column: "article"
    max_samples: 15000
    
  # 10 - Multi-News Summarization
  - name: "multi_news"
    subset: null
    split: "train"
    text_column: "document"
    max_samples: 30000
    
  # 11 - XSum News
  - name: "xsum"
    subset: null
    split: "train"
    text_column: "document"
    max_samples: 50000
    
  # 12 - Reddit TIFU
  - name: "reddit_tifu"
    subset: "long"
    split: "train"
    text_column: "documents"
    max_samples: 20000
    
  # 13 - Gigaword Headlines
  - name: "gigaword"
    subset: null
    split: "train"
    text_column: "document"
    max_samples: 50000
    
  # 14 - WikiHow Instructions
  - name: "wikihow"
    subset: "all"
    split: "train"
    text_column: "text"
    max_samples: 30000
    
  # 15 - Common Sense QA
  - name: "commonsense_qa"
    subset: null
    split: "train"
    text_column: "question"
    
  # 16 - PIQA (Physical Reasoning)
  - name: "piqa"
    subset: null
    split: "train"
    text_column: "goal"
    
  # 17 - HellaSwag (Common Sense)
  - name: "hellaswag"
    subset: null
    split: "train"
    text_column: "ctx"
    max_samples: 30000
    
  # 18 - WinoGrande (Reasoning)
  - name: "winogrande"
    subset: "winogrande_xl"
    split: "train"
    text_column: "sentence"
    
  # 19 - BoolQ (Yes/No Questions)
  - name: "boolq"
    subset: null
    split: "train"
    text_column: "passage"
    
  # 20 - RACE (Reading Comprehension)
  - name: "race"
    subset: "all"
    split: "train"
    text_column: "article"
    max_samples: 50000
    
  # 21 - CoQA (Conversational QA)
  - name: "coqa"
    subset: null
    split: "train"
    text_column: "story"
    
  # 22 - QuAC (Question Answering)
  - name: "quac"
    subset: null
    split: "train"
    text_column: "context"
    max_samples: 30000
    
  # 23 - Natural Questions
  - name: "natural_questions"
    subset: null
    split: "train"
    text_column: "document.tokens.token"
    max_samples: 20000
    
  # 24 - TriviaQA
  - name: "trivia_qa"
    subset: "unfiltered"
    split: "train"
    text_column: "question"
    max_samples: 30000
    
  # 25 - HotpotQA
  - name: "hotpot_qa"
    subset: "fullwiki"
    split: "train"
    text_column: "context"
    max_samples: 30000
    
  # 26 - MS MARCO
  - name: "ms_marco"
    subset: "v2.1"
    split: "train"
    text_column: "passages.passage_text"
    max_samples: 30000
    
  # 27 - DuoRC (Reading Comprehension)
  - name: "duorc"
    subset: "SelfRC"
    split: "train"
    text_column: "plot"
    max_samples: 30000
    
  # 28 - SNLI (Natural Language Inference)
  - name: "snli"
    subset: null
    split: "train"
    text_column: "premise"
    max_samples: 50000
    
  # 29 - MNLI (Multi-Genre NLI)
  - name: "multi_nli"
    subset: null
    split: "train"
    text_column: "premise"
    max_samples: 50000
    
  # 30 - QQP (Quora Question Pairs)
  - name: "glue"
    subset: "qqp"
    split: "train"
    text_column: "question1"
    max_samples: 50000
    
  # 31 - SST-2 (Sentiment)
  - name: "glue"
    subset: "sst2"
    split: "train"
    text_column: "sentence"
    
  # 32 - MRPC (Paraphrase)
  - name: "glue"
    subset: "mrpc"
    split: "train"
    text_column: "sentence1"
    
  # 33 - RTE (Textual Entailment)
  - name: "glue"
    subset: "rte"
    split: "train"
    text_column: "sentence1"
    
  # 34 - QNLI (Question NLI)
  - name: "glue"
    subset: "qnli"
    split: "train"
    text_column: "question"
    max_samples: 50000
    
  # 35 - CoLA (Linguistic Acceptability)
  - name: "glue"
    subset: "cola"
    split: "train"
    text_column: "sentence"
    
  # 36 - Poem Sentiment
  - name: "poem_sentiment"
    subset: null
    split: "train"
    text_column: "verse_text"
    
  # 37 - Financial PhraseBank
  - name: "financial_phrasebank"
    subset: "sentences_allagree"
    split: "train"
    text_column: "sentence"
    
  # 38 - Emotion Detection
  - name: "emotion"
    subset: null
    split: "train"
    text_column: "text"
    
  # 39 - Tweet Eval Sentiment
  - name: "tweet_eval"
    subset: "sentiment"
    split: "train"
    text_column: "text"

# Dataset Categories:
# - Encyclopedia: WikiText
# - Creative Writing: TinyStories, BookCorpus, Reddit TIFU
# - News: AG News, XSum, Multi-News, Gigaword
# - Math & Reasoning: GSM8K, PIQA, HellaSwag, WinoGrande
# - Q&A: SQuAD, CoQA, QuAC, Natural Questions, TriviaQA, HotpotQA
# - Reviews & Sentiment: IMDB, Yelp, SST-2, Emotion, Tweet Eval, Financial
# - Instructions: WikiHow, ELI5
# - Scientific: ArXiv Papers
# - NLI & Logic: SNLI, MNLI, RTE, QNLI, BoolQ
# - Reading Comprehension: RACE, DuoRC, MS MARCO
# - Paraphrase: MRPC, QQP
# - Linguistic: CoLA, Poem Sentiment

tokenizer:
  pretrained: "gpt2"

preprocessing:
  concat_texts: true
  min_length: 20
