# Hugging Face Datasets Configuration
# Fin.AI cycles through these datasets every 1 hour 10 minutes
# All datasets rigorously tested and verified working

datasets:
  # 0 - Wikipedia
  - name: "wikitext"
    subset: "wikitext-2-raw-v1"
    split: "train"
    text_column: "text"
    
  # 1 - TinyStories
  - name: "roneneldan/TinyStories"
    subset: null
    split: "train"
    text_column: "text"
    max_samples: 30000
    
  # 2 - Math Reasoning
  - name: "openai/gsm8k"
    subset: "main"
    split: "train"
    text_column: "question"
    
  # 3 - SQuAD Q&A
  - name: "squad"
    subset: null
    split: "train"
    text_column: "context"
    max_samples: 50000
    
  # 4 - IMDB Reviews
  - name: "imdb"
    subset: null
    split: "train"
    text_column: "text"
    max_samples: 25000
    
  # 5 - AG News
  - name: "ag_news"
    subset: null
    split: "train"
    text_column: "text"
    
  # 6 - Yelp Reviews
  - name: "yelp_review_full"
    subset: null
    split: "train"
    text_column: "text"
    max_samples: 50000
    
  # 7 - CNN DailyMail
  - name: "cnn_dailymail"
    subset: "3.0.0"
    split: "train"
    text_column: "article"
    max_samples: 30000
    
  # 8 - Billsum
  - name: "billsum"
    subset: null
    split: "train"
    text_column: "text"
    max_samples: 20000
    
  # 9 - Common Sense QA
  - name: "commonsense_qa"
    subset: null
    split: "train"
    text_column: "question"
    
  # 10 - HellaSwag
  - name: "hellaswag"
    subset: null
    split: "train"
    text_column: "ctx"
    max_samples: 30000
    
  # 11 - WinoGrande
  - name: "winogrande"
    subset: "winogrande_xl"
    split: "train"
    text_column: "sentence"
    
  # 12 - BoolQ
  - name: "boolq"
    subset: null
    split: "train"
    text_column: "passage"
    
  # 13 - RACE
  - name: "race"
    subset: "all"
    split: "train"
    text_column: "article"
    max_samples: 50000
    
  # 14 - CoQA
  - name: "stanfordnlp/coqa"
    subset: null
    split: "train"
    text_column: "story"
    max_samples: 30000
    
  # 15 - C4
  - name: "allenai/c4"
    subset: "en"
    split: "train"
    text_column: "text"
    max_samples: 20000
    streaming: true
    
  # 16 - OpenWebText
  - name: "Skylion007/openwebtext"
    subset: null
    split: "train"
    text_column: "text"
    max_samples: 20000
    streaming: true
    
  # 17 - TriviaQA (streaming to save space)
  - name: "trivia_qa"
    subset: "unfiltered"
    split: "train"
    text_column: "question"
    max_samples: 10000
    streaming: true
    
  # 18 - HotpotQA (streaming to save space)
  - name: "hotpot_qa"
    subset: "distractor"
    split: "train"
    text_column: "question"
    max_samples: 10000
    streaming: true
    
  # 19 - MS MARCO (streaming to save space)
  - name: "microsoft/ms_marco"
    subset: "v1.1"
    split: "train"
    text_column: "query"
    max_samples: 10000
    streaming: true
    
  # 20 - DuoRC (streaming to save space)
  - name: "duorc"
    subset: "ParaphraseRC"
    split: "train"
    text_column: "plot"
    max_samples: 10000
    streaming: true
    
  # 21 - Amazon Polarity (streaming to save space)
  - name: "amazon_polarity"
    subset: null
    split: "train"
    text_column: "content"
    max_samples: 10000
    streaming: true
    
  # 22 - Financial News
  - name: "zeroshot/twitter-financial-news-sentiment"
    subset: null
    split: "train"
    text_column: "text"
    
  # 23 - SciQ
  - name: "sciq"
    subset: null
    split: "train"
    text_column: "support"
    
  # 24 - Quail (streaming to save space)
  - name: "quail"
    subset: null
    split: "train"
    text_column: "context"
    max_samples: 10000
    streaming: true
    
  # 25 - WikiQA
  - name: "wiki_qa"
    subset: null
    split: "train"
    text_column: "question"
    
  # 26 - PAWS
  - name: "paws"
    subset: "labeled_final"
    split: "train"
    text_column: "sentence1"
    
  # 27 - Medical Questions
  - name: "medical_questions_pairs"
    subset: null
    split: "train"
    text_column: "question_1"
    
  # 28 - App Reviews
  - name: "app_reviews"
    subset: null
    split: "train"
    text_column: "review"
    
  # 29 - Rotten Tomatoes
  - name: "rotten_tomatoes"
    subset: null
    split: "train"
    text_column: "text"

tokenizer:
  pretrained: "gpt2"

preprocessing:
  concat_texts: true
  min_length: 20
