  # Hour 23 - PubMed Medical (repeat)
  - name: "ccdv/pubmed-summarization"
    subset: null
    split: "train"
    text_column: "article"
    max_samples: 30000

# Rotation: Cycles through datasets based on hour of day (0-23)
# Each hour trains on a different dataset for diversity
# Note: Some datasets repeat to fill 24 hours (only 13 unique working datasets)

tokenizer:
  pretrained: "gpt2"

preprocessing:
  concat_texts: true
  min_length: 20
