# Hugging Face Datasets Configuration
# Each day or run trains on a different dataset

datasets:
  # General Knowledge (Wikipedia)
  - name: "wikitext"
    subset: "wikitext-2-raw-v1"
    split: "train"
    text_column: "text"
    day: 1
    
  # Natural Language / Storytelling
  - name: "roneneldan/TinyStories"
    subset: null
    split: "train"
    text_column: "text"
    max_samples: 50000
    day: 2
    
  # News & Summarization
  - name: "cnn_dailymail"
    subset: "3.0.0"
    split: "train"
    text_column: "article"
    max_samples: 30000
    day: 3
    
  # Instruction Following
  - name: "databricks/databricks-dolly-15k"
    subset: null
    split: "train"
    text_column: "context"
    day: 4
    
  # Q&A Context
  - name: "squad_v2"
    subset: null
    split: "train"
    text_column: "context"
    max_samples: 30000
    day: 6
    
  # High Quality Web Content (FineWeb-Edu)
  - name: "HuggingFaceFW/fineweb-edu"
    subset: "sample-10BT"
    split: "train"
    text_column: "text"
    max_samples: 50000
    day: 0

  # High Quality Web Content (FineWeb)
  - name: "HuggingFaceFW/fineweb"
    subset: "sample-10BT"
    split: "train"
    text_column: "text"
    max_samples: 50000
    day: 7

  # Code & Programming (Clean Python subset)
  - name: "codeparrot/codeparrot-clean-train"
    subset: null
    split: "train"
    text_column: "content"
    max_samples: 10000
    day: 8

  # General Dialogue (OpenAssistant)
  - name: "OpenAssistant/oasst1"
    subset: null
    split: "train"
    text_column: "text"
    max_samples: 20000
    day: 9

cycle:
  state_file: "checkpoints/dataset_state.json"
  rotate_on_run: true # Enable rotation per run instead of per day

tokenizer:
  pretrained: "gpt2"

preprocessing:
  concat_texts: true
  min_length: 20
