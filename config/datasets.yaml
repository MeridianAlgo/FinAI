# Hugging Face Datasets Configuration
# Fin.AI cycles through these datasets every hour

datasets:
  # Dataset 1 - Wikipedia
  - name: "wikitext"
    subset: "wikitext-2-raw-v1"
    split: "train"
    text_column: "text"
    
  # Dataset 2 - TinyStories
  - name: "roneneldan/TinyStories"
    subset: null
    split: "train"
    text_column: "text"
    max_samples: 50000
    
  # Dataset 3 - CNN News
  - name: "cnn_dailymail"
    subset: "3.0.0"
    split: "train"
    text_column: "article"
    max_samples: 30000
    
  # Dataset 4 - Dolly Instructions
  - name: "databricks/databricks-dolly-15k"
    subset: null
    split: "train"
    text_column: "context"
    
  # Dataset 5 - OpenWebText
  - name: "Skylion007/openwebtext"
    subset: null
    split: "train"
    text_column: "text"
    max_samples: 50000
    
  # Dataset 6 - Q&A
  - name: "squad_v2"
    subset: null
    split: "train"
    text_column: "context"
    max_samples: 30000
    
  # Dataset 7 - More Wikipedia
  - name: "wikitext"
    subset: "wikitext-103-raw-v1"
    split: "train"
    text_column: "text"
    max_samples: 100000

# Rotation: Cycles through datasets based on hour of day
# Hour 0 → Dataset 1, Hour 1 → Dataset 2, etc.
# After last dataset, wraps back to first

tokenizer:
  pretrained: "gpt2"

preprocessing:
  concat_texts: true
  min_length: 20
