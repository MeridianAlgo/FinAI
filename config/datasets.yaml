# Hugging Face Datasets Configuration
# Fin.AI cycles through these datasets every hour (24 datasets for 24 hours)
# All datasets have been tested and verified to work

datasets:
  # Hour 0 - Wikipedia Small
  - name: "wikitext"
    subset: "wikitext-2-raw-v1"
    split: "train"
    text_column: "text"
    
  # Hour 1 - TinyStories (Creative Writing)
  - name: "roneneldan/TinyStories"
    subset: null
    split: "train"
    text_column: "text"
    max_samples: 20000
    
  # Hour 2 - CNN News
  - name: "cnn_dailymail"
    subset: "3.0.0"
    split: "train"
    text_column: "article"
    max_samples: 30000
    
  # Hour 3 - Math Reasoning (GSM8K)
  - name: "openai/gsm8k"
    subset: "main"
    split: "train"
    text_column: "question"
    
  # Hour 4 - OpenWebText (Web Content)
  - name: "Skylion007/openwebtext"
    subset: null
    split: "train"
    text_column: "text"
    max_samples: 10000
    
  # Hour 5 - SQuAD Q&A
  - name: "squad_v2"
    subset: null
    split: "train"
    text_column: "context"
    max_samples: 30000
    
  # Hour 6 - Wikipedia Large
  - name: "wikitext"
    subset: "wikitext-103-raw-v1"
    split: "train"
    text_column: "text"
    max_samples: 50000
    
  # Hour 7 - Instruction Following (Alpaca)
  - name: "tatsu-lab/alpaca"
    subset: null
    split: "train"
    text_column: "text"
    max_samples: 20000
    
  # Hour 8 - IMDB Reviews (Sentiment)
  - name: "imdb"
    subset: null
    split: "train"
    text_column: "text"
    max_samples: 40000
    
  # Hour 9 - Common Sense Reasoning
  - name: "commonsense_qa"
    subset: null
    split: "train"
    text_column: "question"
    max_samples: 10000
    
  # Hour 10 - Amazon Reviews
  - name: "amazon_polarity"
    subset: null
    split: "train"
    text_column: "content"
    max_samples: 20000
    
  # Hour 11 - Common Crawl (C4)
  - name: "allenai/c4"
    subset: "en"
    split: "train"
    text_column: "text"
    max_samples: 15000
    
  # Hour 12 - PubMed Medical
  - name: "ccdv/pubmed-summarization"
    subset: null
    split: "train"
    text_column: "article"
    max_samples: 10000
    
  # Hour 13 - Conversations (UltraChat)
  - name: "HuggingFaceH4/ultrachat_200k"
    subset: null
    split: "train_sft"
    text_column: "messages"
    max_samples: 15000
    
  # Hour 14 - Dolly Instructions
  - name: "databricks/databricks-dolly-15k"
    subset: null
    split: "train"
    text_column: "context"
    
  # Hour 15 - AG News (Headlines)
  - name: "ag_news"
    subset: null
    split: "train"
    text_column: "text"
    
  # Hour 16 - Yelp Reviews
  - name: "yelp_review_full"
    subset: null
    split: "train"
    text_column: "text"
    max_samples: 20000
    
  # Hour 17 - Common Crawl News
  - name: "cc_news"
    subset: null
    split: "train"
    text_column: "text"
    max_samples: 40000
    
  # Hour 18 - TinyStories (repeat)
  - name: "roneneldan/TinyStories"
    subset: null
    split: "train"
    text_column: "text"
    max_samples: 20000
    
  # Hour 19 - Math Reasoning (repeat)
  - name: "openai/gsm8k"
    subset: "main"
    split: "train"
    text_column: "question"
    
  # Hour 20 - CNN News (repeat)
  - name: "cnn_dailymail"
    subset: "3.0.0"
    split: "train"
    text_column: "article"
    max_samples: 30000
    
  # Hour 21 - Instruction Following (repeat)
  - name: "tatsu-lab/alpaca"
    subset: null
    split: "train"
    text_column: "text"
    max_samples: 20000
    
  # Hour 22 - SQuAD Q&A (repeat)
  - name: "squad_v2"
    subset: null
    split: "train"
    text_column: "context"
    max_samples: 30000
    
  # Hour 23 - Common Sense Reasoning (repeat)
  - name: "commonsense_qa"
    subset: null
    split: "train"
    text_column: "question"
    max_samples: 10000

# Rotation: Cycles through datasets based on hour of day (0-23)
# Dataset Categories:
# - Encyclopedia: WikiText (hours 0, 6)
# - Creative Writing: TinyStories (hours 1, 18)
# - News: CNN, AG News, CC News (hours 2, 15, 17, 20)
# - Math & Reasoning: GSM8K, CommonsenseQA (hours 3, 9, 19, 23)
# - Web Content: OpenWebText, C4 (hours 4, 11)
# - Q&A: SQuAD (hours 5, 22)
# - Instructions: Alpaca, Dolly (hours 7, 14, 21)
# - Reviews: IMDB, Amazon, Yelp (hours 8, 10, 16)
# - Medical: PubMed (hour 12)
# - Conversations: UltraChat (hour 13)

tokenizer:
  pretrained: "gpt2"

preprocessing:
  concat_texts: true
  min_length: 20
