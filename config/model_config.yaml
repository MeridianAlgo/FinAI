# Fin.AI Model Configuration
# Optimized for GitHub Actions free tier (CPU)

model:
  size_preset: "tiny"  # Smaller model for faster CPU training

training:
  batch_size: 16
  gradient_accumulation_steps: 2
  learning_rate: 5.0e-4
  weight_decay: 0.01
  warmup_steps: 100
  max_steps: 800  # 1.5 hours on CPU
  eval_steps: 100
  save_steps: 400
  max_grad_norm: 1.0
  fp16: false  # CPU doesn't support fp16
  optimizer: "adamw"
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8

data:
  max_seq_len: 512  # Shorter sequences for speed
  num_workers: 0

checkpointing:
  output_dir: "./checkpoints"
  save_total_limit: 3
  resume_from_checkpoint: true

logging:
  log_steps: 10
  use_wandb: true
  wandb_project: "fin-ai"
  plot_steps: 100
