
# Fin.AI Model Configuration
# Optimized for GitHub Actions (CPU) / Cloud (GPU) with V3 architecture
# Now supporting Flash Attention, RoPE, and Safetensors

model:
  model_type: "finai"
  size_preset: "base"  # ~124M params, GPT-2 Small equivalent
  vocab_size: 50257
  max_seq_len: 1024
  dropout: 0.1
  activation: "swiglu"
  use_flash_attention: true
  rope_theta: 10000.0

training:
  batch_size: 2
  gradient_accumulation_steps: 16
  learning_rate: 3.0e-4
  weight_decay: 0.1
  warmup_steps: 50
  max_steps: 200  # Reduced for Base model (slower on CPU)
  eval_steps: 250
  save_steps: 800  # Save checkpoint every 800 steps
  max_grad_norm: 1.0
  fp16: false  # Auto-detected in trainer, set false here for safety defaults
  optimizer: "adamw"
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8

data:
  max_seq_len: 1024
  num_workers: 0

checkpointing:
  output_dir: "./checkpoints"
  save_total_limit: 2
  resume_from_checkpoint: true
  hf_repo_id: "MeridianAlgo/Fin.AI"  # Hugging Face repository ID
  push_to_hub: true  # Enable pushing checkpoints to Hugging Face

logging:
  log_steps: 10
  use_comet: true
  comet_project: "fin-ai"
  comet_workspace: "meridianalgo"
  plot_steps: 100
