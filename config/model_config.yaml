model:
  vocab_size: 52000  # Will be adjusted by tokenizer
  hidden_size: 1024
  num_hidden_layers: 24
  num_attention_heads: 8
  num_key_value_heads: 2
  intermediate_size: 1536  # Reduced to fit 700M budget with MoE
  mamba_ratio: 0.5  # 12 Mamba, 12 Transformer
  mamba_d_state: 16
  mamba_d_conv: 4
  mamba_expand: 2
  ssm_skip_threshold: 0.15
  use_moe: true
  num_experts: 6
  num_experts_per_tok: 2
  moe_intermediate_size: 1536
  mla_latent_rank: 64
  num_mtp_heads: 2
  mtp_weight: 0.5
  max_position_embeddings: 8192

training:
  batch_size: 4  # Adjusted for CPU
  gradient_accumulation_steps: 16  # High accumulation for stability
  learning_rate: 0.0003
  weight_decay: 0.01
  warmup_steps: 100
  max_steps: 1000 # High enough to be controlled by max_time_seconds
  max_time_seconds: 1800 # 30 minutes training, 15 minutes for saving/pushing
  optimizer: "adamw_8bit"
  save_steps: 100
  log_steps: 10
  output_dir: "./checkpoints"
  push_to_hub: true
  hf_repo_id: "MeridianAlgo/FinAI-Lite"