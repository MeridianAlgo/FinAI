# Fin.AI Model Configuration
# Optimized for GitHub Actions free tier (CPU) with v2 architecture

model:
  size_preset: "small"  # ~40M params, good balance of quality and speed
  max_seq_len: 512

training:
  batch_size: 4  # Reduced for memory efficiency (CPU)
  gradient_accumulation_steps: 8  # Effective batch size = 32
  learning_rate: 5.0e-4  # Higher LR for faster convergence
  weight_decay: 0.1  # Stronger regularization
  warmup_steps: 50  # Quick warmup
  max_steps: 1000  # More training steps
  eval_steps: 250
  save_steps: 500
  max_grad_norm: 1.0
  fp16: false  # CPU doesn't support fp16
  optimizer: "adamw"
  adam_beta1: 0.9
  adam_beta2: 0.95  # Better for transformers
  adam_epsilon: 1.0e-8

data:
  max_seq_len: 512
  num_workers: 0

checkpointing:
  output_dir: "./checkpoints"
  save_total_limit: 2  # Keep only 2 checkpoints to save space
  resume_from_checkpoint: true

logging:
  log_steps: 10
  use_wandb: true
  wandb_project: "fin-ai"
  plot_steps: 100
