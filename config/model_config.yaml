model:
  vocab_size: 52000
  hidden_size: 1024
  num_hidden_layers: 16
  num_attention_heads: 16
  num_key_value_heads: 4
  intermediate_size: 2048
  mamba_ratio: 0.5
  mamba_d_state: 16
  mamba_d_conv: 4
  mamba_expand: 2
  ssm_skip_threshold: 0.15
  use_moe: true
  num_experts: 8
  num_experts_per_tok: 2
  moe_intermediate_size: 2048
  mla_latent_rank: 64
  num_mtp_heads: 2
  mtp_weight: 0.5
  max_position_embeddings: 4096
  gradient_checkpointing: true

training:
  batch_size: 2  # Reduced batch size
  gradient_accumulation_steps: 16  # Increased accumulation for stability
  learning_rate: 0.0001  # Lower LR for stability
  weight_decay: 0.1
  warmup_steps: 100
  max_steps: 90
  optimizer: "adamw"  # Standard AdamW
  save_steps: 100
  log_steps: 10
  max_grad_norm: 1.0
  output_dir: "./checkpoints"
  push_to_hub: true
  hf_repo_id: "MeridianAlgo/FinAI-Lite"