# Fin.AI Model Configuration
# Optimized for GitHub Actions free tier (CPU)

model:
  size_preset: "small"  # Better model for improved quality
  max_seq_len: 512

training:
  batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 100
  max_steps: 450  # Reduced to fit 80-minute timeout
  eval_steps: 200
  save_steps: 400
  max_grad_norm: 1.0
  fp16: false  # CPU doesn't support fp16
  optimizer: "adamw"
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8

data:
  max_seq_len: 512
  num_workers: 0

checkpointing:
  output_dir: "./checkpoints"
  save_total_limit: 3
  resume_from_checkpoint: true

logging:
  log_steps: 10
  use_wandb: true
  wandb_project: "fin-ai"
  plot_steps: 100
