# Fin.AI Model Configuration

model:
  size_preset: "small"

training:
  batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 3.0e-4
  weight_decay: 0.1
  warmup_steps: 1000
  max_steps: 100000
  eval_steps: 500
  save_steps: 1000
  max_grad_norm: 1.0
  fp16: true
  optimizer: "adamw"
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8

data:
  max_seq_len: 1024
  num_workers: 4

checkpointing:
  output_dir: "./checkpoints"
  save_total_limit: 3
  resume_from_checkpoint: true

logging:
  log_steps: 10
  use_wandb: true
  wandb_project: "fin-ai"
  plot_steps: 500
