model:
  hidden_size: 1280
  num_hidden_layers: 20
  num_attention_heads: 10
  num_key_value_heads: 2
  intermediate_size: 2560
  mamba_ratio: 0.6
  mamba_d_state: 16
  mamba_d_conv: 4
  mamba_expand: 2
  ssm_skip_rate: 0.45
  use_moe: true
  num_experts: 6
  num_experts_per_tok: 2
  moe_intermediate_size: 2560
  mla_latent_rank: 64
  num_mtp_heads: 3
  mtp_weight: 0.5
  max_position_embeddings: 4096

training:
  batch_size: 1
  gradient_accumulation_steps: 32
  learning_rate: 0.0002
  weight_decay: 0.05
  warmup_steps: 500
  max_steps: 50000
  optimizer: "adamw_8bit"
  save_steps: 400
  log_steps: 5
  output_dir: "./checkpoints"
  push_to_hub: true
  hf_repo_id: "MeridianAlgo/FinAI-Core-v2.2-UltraLite"
