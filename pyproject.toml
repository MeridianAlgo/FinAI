[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fin_ai"
version = "0.1.0"
description = "Fin.AI language model training package"
authors = [{name = "Ishaan", email = "ishaan@example.com"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "torch",
    "transformers",
    "datasets",
    "tqdm",
    "pyyaml",
    "wandb",
    "pytest",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
]

[project.urls]
Homepage = "https://github.com/MeridianAlgo/FinAI"
Repository = "https://github.com/MeridianAlgo/FinAI"
Documentation = "https://github.com/MeridianAlgo/FinAI#readme"

[project.optional-dependencies]
dev = ["black", "ruff", "pre-commit", "pytest", "mypy"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # Line too long
    "E402",  # Module level import not at top of file
    "E722",  # Do not use bare except
    "F403",  # Star imports
    "F841",  # Local variable assigned but never used
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fin_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--disable-warnings",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
