name: Auto-Release on Push

on:
  push:
    branches:
      - main

jobs:
  lint-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black ruff isort

      - name: Run Linting
        run: |
          black --check .
          ruff check .
          isort --check-only .

      - name: Calculate Version
        id: version
        run: |
          # Start from v4.0.0 base
          BASE_VERSION="v4.0.0"
          
          # Get the number of commits since the start of v4.0.0 or just total commits as a patch increment 
          # Or simpler: Find latest tag, if not found start at v4.0.0
          
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v4.0.0")
          
          if [ "$LATEST_TAG" = "v4.0.0" ] && [ "$(git tag -l v4.0.0)" = "" ]; then
             # First time
             NEW_VERSION="v4.0.0"
          else
             # Increment patch version
             VERSION=${LATEST_TAG#v}
             MAJOR=$(echo $VERSION | cut -d. -f1)
             MINOR=$(echo $VERSION | cut -d. -f2)
             PATCH=$(echo $VERSION | cut -d. -f3)
             
             # If the latest tag is actually just v4.0.0 and it exists, we start incrementing
             PATCH=$((PATCH + 1))
             NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          fi
          
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Determined new version: $NEW_VERSION"

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.NEW_VERSION }}
          name: "Fin.AI ${{ steps.version.outputs.NEW_VERSION }}"
          body: |
            ## Fin.AI ${{ steps.version.outputs.NEW_VERSION }}
            
            **Commit**: ${{ github.sha }}
            **Date**: ${{ github.event.head_commit.timestamp }}
            
            ### Changes
            
            ${{ github.event.head_commit.message }}
            
            ### Files Modified
            
            The full list of modified files can be found in the commit details.
            
            ---
            *Automated release generated on push to main.*
          token: ${{ secrets.GITHUB_TOKEN }}
