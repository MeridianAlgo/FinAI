name: Maintenance And Quality Check

on:
  schedule:
    # Run at 8 AM CST (14:00 UTC)
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black torch transformers datasets accelerate

    - name: Check code formatting
      run: |
        echo "Running code quality checks..."
        # Add actual formatting checks here if needed, e.g., black --check .
        echo "Code quality check completed"

    - name: Run pre-training tests
      run: |
        echo "Running validation tests..."
        python tests/test_model.py

    - name: Send Notification
      if: always()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "FinAI Maintenance: ${{ job.status }} - ${{ github.run_number }}"
        to: ${{ secrets.EMAIL_TO }}
        from: FinAI Maintenance Bot
        body: |
          FinAI Maintenance & Quality Check Completed.
          
          Status: ${{ job.status }}
          Run Number: ${{ github.run_number }}
          
          View run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
