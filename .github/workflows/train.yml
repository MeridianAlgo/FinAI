name: FinAI Continual Training

on:
  schedule:
    - cron: '0 * * * *' # Every hour
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install torch transformers bitsandbytes accelerate datasets pyyaml huggingface_hub
          pip install -e .

      - name: Train FinAI on FineWeb-Edu Slice
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # train.py handles:
          # 1. Pulling latest model from HF (if not local)
          # 2. Loading next slice of FineWeb-Edu
          # 3. Training
          # 4. Pushing updated model back to HF
          python train.py --max-steps 400 --save-steps 400
