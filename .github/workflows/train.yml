name: FinAI Training Engine

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      force_seed:
        description: 'Nuke and Re-seed HF Repo?'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seed:
    name: "Nuke & Seed HF"
    if: github.event.inputs.force_seed == 'true'
    runs-on: ubuntu-latest
    environment: HuggingFace Hub
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Critical Deps
        run: pip install huggingface_hub transformers torch datasets python-dotenv
      - name: Run Nuke & Seed
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PYTHONPATH: .
        run: python scripts/seed_hf_repo.py

  train:
    name: "Continuous Distributed Training"
    needs: seed
    if: |
      always() && 
      (needs.seed.result == 'success' || needs.seed.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black

      - name: Lint and Format
        run: |
          black .
          ruff check . --fix

      - name: Pull Model State
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import snapshot_download, list_repo_files
          import os, shutil
          
          repo_id = 'MeridianAlgo/FinAI-Lite'
          token = os.getenv('HF_TOKEN')
          
          try:
              files = list_repo_files(repo_id=repo_id, token=token)
              print(f'Files in repo: {files[:10]}...')
              
              has_checkpoint = any('checkpoint/' in f for f in files)
              has_root_model = 'config.json' in files
              
              if has_checkpoint:
                  print('Checkpoint found! Pulling checkpoint...')
                  snapshot_download(
                      repo_id=repo_id, 
                      local_dir='./checkpoint',
                      allow_patterns='checkpoint/**',
                      token=token
                  )
                  if os.path.exists('./checkpoint/checkpoint'):
                      for item in os.listdir('./checkpoint/checkpoint'):
                          shutil.move(
                              os.path.join('./checkpoint/checkpoint', item),
                              os.path.join('./checkpoint', item)
                          )
                      os.rmdir('./checkpoint/checkpoint')
                  print('Checkpoint pulled successfully')
              elif has_root_model:
                  print('Root model found! Pulling to model directory...')
                  snapshot_download(
                      repo_id=repo_id,
                      local_dir='./model',
                      token=token
                  )
                  print('Root model pulled successfully')
              else:
                  print('No model found in repo. Starting fresh.')
          except Exception as e:
              print(f'Error pulling state: {e}. Starting fresh.')
          "

      - name: Execute Training Loop
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          COMET_API_KEY: ${{ secrets.COMET_API_KEY }}
          MAX_STEPS: 200
          TOTAL_STEPS: 100000
          PYTHONPATH: .
        run: python train.py

      - name: Deploy to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import HfApi
          import os
          api = HfApi()
          print('Uploading checkpoint to MeridianAlgo/FinAI-Lite...')
          api.upload_folder(
              folder_path='./checkpoint',
              repo_id='MeridianAlgo/FinAI-Lite',
              path_in_repo='checkpoint',
              commit_message='Training checkpoint update via GitHub Engine [skip ci]',
              token=os.getenv('HF_TOKEN')
          )
          print('Deployment successful!')
          "

      - name: Upload Training State (GitHub Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: model-checkpoint
          path: checkpoint/
          retention-days: 1

      - name: Update Repository State
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --staged --quiet || git commit -m "chore: sync dataset state and lint fixes [skip ci]"
          git pull --rebase -X theirs origin main || (git rebase --abort && git pull --no-rebase origin main)
          git push origin main
