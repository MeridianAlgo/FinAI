name: FinAI Continual Training

on:
  schedule:
    - cron: '0 * * * *' # Every hour
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install torch transformers bitsandbytes accelerate datasets pyyaml
          pip install -e .

      - name: Ingest Fresh Data
        run: python continual_ingest.py

      - name: Train FinAI
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python train.py --max-steps 400 --save-steps 400

      - name: Push to HF
        if: success()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/publish_to_hf.py