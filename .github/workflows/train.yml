name: FinAI Training Engine

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      force_seed:
        description: 'Nuke and Re-seed HF Repo?'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  seed:
    name: "Nuke & Seed HF"
    if: github.event.inputs.force_seed == 'true'
    runs-on: ubuntu-latest
    environment: HuggingFace Hub
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Critical Deps
        run: pip install huggingface_hub transformers torch datasets python-dotenv
      - name: Run Nuke & Seed
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PYTHONPATH: .
        run: python scripts/seed_hf_repo.py

  train:
    name: "Continuous Distributed Training"
    needs: seed
    if: |
      always() && 
      (needs.seed.result == 'success' || needs.seed.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install Dependencies
        run: pip install -r requirements.txt
      
      - name: Pull Model State
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import snapshot_download
          import os
          try:
              snapshot_download(repo_id='MeridianAlgo/FinAI-Lite', local_dir='./checkpoints_next/model', token=os.getenv('HF_TOKEN'))
              print('State pulled from HF')
          except Exception as e:
              print(f'Fresh start required: {e}')
          "

      - name: Execute Training Loop
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          COMET_API_KEY: ${{ secrets.COMET_API_KEY }}
          MAX_STEPS: 200
          TOTAL_STEPS: 100000
          PYTHONPATH: .
        run: python train.py

      - name: Deploy to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import HfApi
          import os
          api = HfApi()
          print('Uploading to Hugging Face...')
          api.upload_folder(
              folder_path='./checkpoints_next/model',
              repo_id='MeridianAlgo/FinAI-Lite',
              commit_message='Hourly deployment via GitHub Engine [skip ci]',
              token=os.getenv('HF_TOKEN')
          )
          print('Deployment successful!')
          "

      - name: Upload Training State (GitHub Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: model-checkpoint
          path: ./checkpoints_next/model/
          retention-days: 1

      - name: Update Repository State
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add dataset_state.json
          git commit -m "chore: sync dataset state [skip ci]" || echo "No changes"
          git pull --rebase -X theirs origin main
          git push origin main
