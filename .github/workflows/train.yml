name: FinAI Continual Training

on:
  schedule:
    - cron: '0 * * * *' # Every hour
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install torch transformers accelerate datasets pyyaml huggingface_hub
          pip install -e .

      - name: Download model from HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        timeout-minutes: 15
        continue-on-error: true
        run: |
          echo "Downloading model from HuggingFace..."
          python -c "
          from huggingface_hub import snapshot_download
          import os
          
          token = os.environ.get('HF_TOKEN')
          repo_id = 'MeridianAlgo/FinAI-Lite'
          
          try:
              # Download only essential files, skip large files if needed
              snapshot_download(
                  repo_id=repo_id,
                  local_dir='checkpoints/model',
                  token=token,
                  max_workers=16,
                  resume_download=True,
                  local_dir_use_symlinks=False
              )
              print('✓ Model downloaded successfully')
          except Exception as e:
              print(f'✗ Download failed: {e}')
              print('Will initialize new model during training')
              exit(0)  # Don't fail the workflow
          "

      - name: Train FinAI on FineWeb-Edu Slice
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        timeout-minutes: 25
        run: |
          # train.py handles:
          # 1. Loading model from checkpoints/model (or initializing new)
          # 2. Loading next slice of FineWeb-Edu
          # 3. Training for configured steps
          # 4. Pushing updated model back to HF using HF's infrastructure
          python train.py

      - name: Commit dataset state
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          
          if [ -f "dataset_state.json" ]; then
            git add dataset_state.json
            if ! git diff --quiet --cached; then
              git commit -m "Update dataset state after training [skip ci]"
              git push
            fi
          fi
