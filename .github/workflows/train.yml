name: Train Fin.AI

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      max_steps:
        description: 'Maximum training steps'
        required: false
        default: '1000'

env:
  PYTHON_VERSION: '3.10'
  HF_REPO_ID: 'MeridianAlgo/Fin.AI'

concurrency:
  group: fin-ai-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: write
      issues: write
    
    steps:
      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h
          
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          sudo apt-get clean
          
          echo "Disk space after cleanup:"
          df -h
      
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Cache Hugging Face
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            /tmp/hf_cache
            /tmp/hf_home
          key: ${{ runner.os }}-hf-${{ hashFiles('requirements.txt', 'config/datasets.yaml', 'config/model_config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-hf-
      
      - name: Download model and checkpoint from Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python << 'EOF'
          import os
          from huggingface_hub import hf_hub_download, list_repo_files, HfApi
          
          token = os.environ.get("HF_TOKEN")
          repo_id = "${{ env.HF_REPO_ID }}"
          
          if not token:
              print("No HF_TOKEN found, starting fresh")
              exit(0)
          
          api = HfApi(token=token)
          
          try:
              files = list_repo_files(repo_id, token=token)
              print(f"Found {len(files)} files in {repo_id}")
              
              os.makedirs("checkpoints/model", exist_ok=True)
              os.makedirs("checkpoints", exist_ok=True)
              
              print("\nDownloading model files...")
              required_files = ['config.json']
              optional_files = [
                  'model.safetensors', 
                  'pytorch_model.bin', 
                  'version.json', 
                  'README.md', 
                  'generation_config.json',
                  'configuration_finai.py',
                  'modeling_finai.py',
                  '__init__.py'
              ]
              
              import shutil
              
              for f in required_files:
                  if f in files:
                      print(f"  Downloading {f}...")
                      try:
                          downloaded_path = hf_hub_download(
                              repo_id=repo_id,
                              filename=f,
                              local_dir="checkpoints",
                              token=token
                          )
                          target_path = os.path.join("checkpoints/model", f)
                          if downloaded_path != target_path:
                              shutil.move(downloaded_path, target_path)
                          print(f"   {f}")
                      except Exception as e:
                          print(f"   Failed to download {f}: {e}")
                          print("Will start fresh training...")
                          exit(0)
                  else:
                      print(f"  Required file {f} not found in repo")
                      print("Will start fresh training...")
                      exit(0)
              
              for f in optional_files:
                  if f in files:
                      try:
                          downloaded_path = hf_hub_download(
                              repo_id=repo_id,
                              filename=f,
                              local_dir="checkpoints",
                              token=token
                          )
                          target_path = os.path.join("checkpoints/model", f)
                          if downloaded_path != target_path:
                              shutil.move(downloaded_path, target_path)
                          print(f"   {f}")
                      except Exception as e:
                          print(f"  INFO: Could not download {f}: {e}")
              
              print("\nDownloading checkpoint file...")
              
              from datetime import datetime
              datasets_config_path = "config/datasets.yaml"
              if os.path.exists(datasets_config_path):
                  import yaml
                  with open(datasets_config_path, 'r') as f:
                      datasets_config = yaml.safe_load(f)
                  datasets = datasets_config.get('datasets', [])
                  if datasets:
                      current_hour = datetime.now().hour
                      current_dataset_idx = current_hour % len(datasets)
                      dataset_name = datasets[current_dataset_idx].get('name', 'unknown')
                      if '/' in dataset_name:
                          dataset_name = dataset_name.split('/')[-1]
                  else:
                      dataset_name = 'unknown'
              else:
                  dataset_name = 'unknown'
              
              checkpoint_filename = f"checkpoint-{dataset_name}.pt"
              
              if checkpoint_filename in files:
                  print(f"  Found checkpoint: {checkpoint_filename}")
                  
                  try:
                      hf_hub_download(
                          repo_id=repo_id,
                          filename=checkpoint_filename,
                          local_dir="checkpoints",
                          token=token
                      )
                      print(f"   Downloaded checkpoint: {checkpoint_filename}")
                  except Exception as e:
                      print(f"  Could not download checkpoint: {e}")
                      print("  Will start from model weights only")
              else:
                  print(f"  INFO: No checkpoint file found ({checkpoint_filename}), will start from model weights")
              
              print("\nDownload complete! Ready for training.")
          except Exception as e:
              print(f"Error downloading from HF: {e}")
              print("Starting fresh training...")
          EOF

      - name: Smoke test downloaded model
        run: |
          python << 'EOF'
          import os
          import torch
          from transformers import AutoTokenizer
          from fin_ai.model import FinAIForCausalLM

          model_dir = os.path.join("checkpoints", "model")
          if not os.path.exists(os.path.join(model_dir, "config.json")):
              print("No downloaded model found, skipping smoke test")
              raise SystemExit(0)

          model = FinAIForCausalLM.from_pretrained(model_dir)
          model.eval()
          tok = AutoTokenizer.from_pretrained("gpt2")
          if tok.pad_token is None:
              tok.pad_token = tok.eos_token

          prompt = "The market"
          inputs = tok(prompt, return_tensors="pt")
          with torch.no_grad():
              _ = model(**inputs, labels=inputs["input_ids"])
              out = model.generate(**inputs, max_new_tokens=8, do_sample=False)
          print(tok.decode(out[0], skip_special_tokens=True))
          EOF
      
      - name: Setup Comet ML
        env:
          COMET_API_KEY: ${{ secrets.COMET_API_KEY }}
        run: |
          if [ -z "$COMET_API_KEY" ]; then
            echo "COMET_API_KEY not set; disabling Comet ML for this run"
            echo "COMET_DISABLE=true" >> $GITHUB_ENV
            exit 0
          fi

          echo "Setting up Comet ML..."
          echo "COMET_API_KEY=$COMET_API_KEY" >> $GITHUB_ENV

      - name: Train model
        id: train
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          COMET_API_KEY: ${{ secrets.COMET_API_KEY }}
          COMET_PROJECT_NAME: "fin-ai"
          COMET_WORKSPACE: "meridianalgo"
          TOKENIZERS_PARALLELISM: "false"
          HF_DATASETS_CACHE: "/tmp/hf_cache"
          HF_HOME: "/tmp/hf_home"
          HF_DATASETS_TRUST_REMOTE_CODE: "1"
          HF_DATASETS_OFFLINE: "0"
          TMPDIR: "/tmp"
        run: |
          set -o pipefail
          MAX_STEPS="${{ github.event.inputs.max_steps || '1000' }}"
          
          mkdir -p /tmp/hf_cache
          mkdir -p /tmp/hf_home
          
          echo "Disk space before training:"
          df -h
          
          set +e
          timeout 85m python train.py \
            --config config/model_config.yaml \
            --datasets config/datasets.yaml \
            --size-preset base \
            --max-steps $MAX_STEPS \
            --output-dir checkpoints 2>&1 | tee training_output.txt
          TRAIN_STATUS=$?
          set -e

          if [ $TRAIN_STATUS -eq 0 ]; then
            echo "Training completed successfully"
          elif [ $TRAIN_STATUS -eq 124 ]; then
            echo "WARNING: Training timed out after 85 minutes"
            echo "Checkpoint should be saved. Continuing to upload..."
            TRAIN_STATUS=0
          else
            echo "Training failed with exit code $TRAIN_STATUS"
            exit $TRAIN_STATUS
          fi
          
          echo "TRAINING_OUTPUT<<EOF" >> $GITHUB_OUTPUT
          tail -30 training_output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "Disk space after training:"
          df -h
      
      - name: Clean up cache after training
        if: always()
        run: |
          echo "Aggressive cache cleanup to free disk space..."
          echo "Preserving Hugging Face caches for actions/cache"
          
          pip cache purge || true
          find /tmp -maxdepth 1 -type f -user runner -delete 2>/dev/null || true
          find /tmp -maxdepth 1 -type d -user runner -name "tmp*" -exec rm -rf {} + 2>/dev/null || true
          
          echo "Cache cleaned!"
          df -h
      
      - name: Upload model to Hugging Face
        if: success()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python << 'EOF'
          import os
          import json
          from datetime import datetime
          from huggingface_hub import HfApi, create_repo
          
          token = os.environ.get("HF_TOKEN")
          repo_id = "${{ env.HF_REPO_ID }}"
          
          if not token:
              print("No HF_TOKEN found, skipping upload")
              exit(0)
          
          api = HfApi(token=token)
          
          try:
              create_repo(repo_id, token=token, exist_ok=True, repo_type="model")
              print(f"Repository {repo_id} ready")
          except Exception as e:
              print(f"Repo creation note: {e}")
          
          if os.path.exists("MODEL_CARD.md"):
              import shutil
              shutil.copy("MODEL_CARD.md", "checkpoints/model/README.md")
              print("Copied MODEL_CARD.md to model directory as README.md")
          elif os.path.exists("README.md"):
              import shutil
              shutil.copy("README.md", "checkpoints/model/README.md")
              print("Copied README.md to model directory")
          
          if os.path.exists("fin_ai/model/generation_config.json"):
              import shutil
              shutil.copy("fin_ai/model/generation_config.json", "checkpoints/model/generation_config.json")
              print("Copied generation_config.json to model directory")

          import shutil
          shutil.copy("fin_ai/model/configuration_finai.py", "checkpoints/model/configuration_finai.py")
          shutil.copy("fin_ai/model/modeling_finai.py", "checkpoints/model/modeling_finai.py")
          shutil.copy("fin_ai/model/__init__.py", "checkpoints/model/__init__.py")
          print("Copied remote-code modules to model directory")

          config_path = os.path.join("checkpoints", "model", "config.json")
          if os.path.exists(config_path):
              with open(config_path, "r", encoding="utf-8") as f:
                  cfg = json.load(f)

              cfg["model_type"] = "finai"
              cfg["auto_map"] = {
                  "AutoConfig": "configuration_finai.FinAIConfig",
                  "AutoModelForCausalLM": "modeling_finai.FinAIForCausalLM",
              }
              cfg.setdefault("architectures", [])
              if "FinAIForCausalLM" not in cfg["architectures"]:
                  cfg["architectures"].append("FinAIForCausalLM")

              with open(config_path, "w", encoding="utf-8") as f:
                  json.dump(cfg, f, indent=2)
              print("Updated config.json with model_type and auto_map")
          
          model_dir = "checkpoints/model"
          required_files = ["config.json"]
          model_files = ["model.safetensors", "pytorch_model.bin"]
          
          print("\nChecking model files...")
          for f in required_files:
              path = os.path.join(model_dir, f)
              if os.path.exists(path):
                  print(f"   {f}")
              else:
                  print(f"   Missing: {f}")
          
          has_model = False
          for f in model_files:
              path = os.path.join(model_dir, f)
              if os.path.exists(path):
                  print(f"   {f}")
                  has_model = True
                  break
          
          if not has_model:
              print("  No model weights found (model.safetensors or pytorch_model.bin)")
          
          print(f"\nUploading model weights to {repo_id}...")
          
          api.upload_folder(
              folder_path="checkpoints/model",
              repo_id=repo_id,
              token=token,
              commit_message=f"Model weights - Run #${{ github.run_number }} - {datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC')}",
          )
          print(f"Model weights uploaded to https://huggingface.co/{repo_id}")
          
          print(f"\nUploading checkpoint file to {repo_id}...")
          import glob
          checkpoint_files = glob.glob("checkpoints/checkpoint-*.pt")
          
          if checkpoint_files:
              from huggingface_hub import upload_file
              for checkpoint_path in checkpoint_files:
                  checkpoint_filename = os.path.basename(checkpoint_path)
                  try:
                      upload_file(
                          path_or_fileobj=checkpoint_path,
                          path_in_repo=checkpoint_filename,
                          repo_id=repo_id,
                          token=token,
                          repo_type="model",
                          commit_message=f"Checkpoint - Run #${{ github.run_number }} - {datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC')}",
                      )
                      print(f"   Uploaded: {checkpoint_filename}")
                  except Exception as e:
                      print(f"  WARNING: Failed to upload {checkpoint_filename}: {e}")
          else:
              print("  INFO: No checkpoint file found to upload")
          
          print("\nCleaning up legacy files...")
          legacy_files = ["final_config.json", "model.pt"]
          for file_path in legacy_files:
              try:
                  api.delete_file(
                      path_in_repo=file_path,
                      repo_id=repo_id,
                      token=token,
                      commit_message=f"Remove legacy V2 file: {file_path}"
                  )
                  print(f"   Deleted: {file_path}")
              except Exception as e:
                  if "404" not in str(e):
                      print(f"  INFO: {file_path}: {e}")
          
          print("\nUpload complete!")
          EOF
      
      - name: Update version and push
        if: success()
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          
          git add .
          git stash || echo "Nothing to stash"
          
          git fetch origin main
          git pull --rebase origin main
          
          if ! git stash pop; then
             echo "Merge conflict during stash pop, favoring local changes"
             git checkout --ours . || git checkout --theirs . || true
          fi
          
          RUN_NUM=${{ github.run_number }}
          echo "RUN_NUM=$RUN_NUM" >> $GITHUB_OUTPUT

          mkdir -p checkpoints
          cat > checkpoints/version.json << EOF
          {
            "run_number": $RUN_NUM,
            "trained_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "hf_repo": "${{ env.HF_REPO_ID }}"
          }
          EOF
          
          git add checkpoints/checkpoint-*.pt 2>/dev/null || true
          git add checkpoints/version.json
          git add checkpoints/dataset_state.json || true
          
          if ! git diff --quiet --cached; then
            git commit -m "Training run #$RUN_NUM - FineWeb-Edu - $(date +'%Y-%m-%d') [skip ci]"
            git push origin main
          fi
      
      - name: Create training version tag
        if: success()
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          
          git fetch --tags
          
          LATEST_TAG=$(git tag -l "v*.*.*" | sort -V | tail -n 1)
          
          if [ -z "$LATEST_TAG" ]; then
            NEW_TAG="v4.1.0"
          else
            VERSION=${LATEST_TAG#v}
            MAJOR=$(echo $VERSION | cut -d. -f1)
            MINOR=$(echo $VERSION | cut -d. -f2)
            PATCH=$(echo $VERSION | cut -d. -f3)
            
            PATCH=$((PATCH + 1))
            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          fi
          
          echo "Creating new training tag: $NEW_TAG"
          
          cat > checkpoints/version.json << EOF
          {
            "version": "$NEW_TAG",
            "run_number": ${{ github.run_number }},
            "trained_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "hf_repo": "${{ env.HF_REPO_ID }}"
          }
          EOF
          
          git add checkpoints/version.json
          git commit -m "Update version to $NEW_TAG [skip ci]" || echo "No changes to commit"
          
          git tag -a "$NEW_TAG" -m "Training run #${{ github.run_number }} - $NEW_TAG"
          git push origin main
          git push origin "$NEW_TAG"
          
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
          echo "Created tag: $NEW_TAG"
      
      - name: Create issue on training failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runNumber = context.runNumber;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const jobUrl = `${runUrl}#step:${context.job}`;
            
            const run = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });
            
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });
            
            const failedJob = jobs.data.jobs.find(job => job.conclusion === 'failure');
            const failedStep = failedJob?.steps.find(step => step.conclusion === 'failure');
            
            let failureType = 'Unknown';
            let failureDetails = 'The training workflow failed. Please review the logs for details.';
            let suggestedActions = [
              'Review workflow logs',
              'Identify root cause',
              'Apply fix',
              'Re-run workflow if needed'
            ];
            
            if (failedStep) {
              const stepName = failedStep.name;
              
              if (stepName.includes('Train model')) {
                failureType = 'Training Failure';
                failureDetails = 'The training step failed. This could be due to:\n- Out of memory\n- Data loading issues\n- Model architecture problems\n- Timeout (exceeded 85 minutes)';
                suggestedActions = [
                  'Check memory usage in logs',
                  'Verify dataset configuration',
                  'Review model architecture settings',
                  'Consider reducing batch size or model size',
                  'Check if timeout occurred (85 min limit)'
                ];
              } else if (stepName.includes('Upload')) {
                failureType = 'Upload Failure';
                failureDetails = 'Failed to upload model to Hugging Face. This could be due to:\n- Invalid HF_TOKEN\n- Network issues\n- Repository permissions\n- File size limits';
                suggestedActions = [
                  'Verify HF_TOKEN is valid and has write permissions',
                  'Check network connectivity',
                  'Verify repository exists and is accessible',
                  'Check file sizes are within limits'
                ];
              } else if (stepName.includes('dependencies')) {
                failureType = 'Dependency Installation Failure';
                failureDetails = 'Failed to install dependencies. This could be due to:\n- Package version conflicts\n- Network issues\n- Missing system dependencies';
                suggestedActions = [
                  'Review requirements.txt for conflicts',
                  'Check PyPI availability',
                  'Verify system dependencies are available'
                ];
              } else if (stepName.includes('disk space')) {
                failureType = 'Disk Space Failure';
                failureDetails = 'Insufficient disk space. This could be due to:\n- Large model checkpoints\n- Dataset cache buildup\n- Insufficient cleanup';
                suggestedActions = [
                  'Review disk space cleanup steps',
                  'Consider reducing checkpoint frequency',
                  'Verify cache cleanup is working'
                ];
              }
            }
            
            const issueTitle = `[${failureType}] Training Run #${runNumber} Failed`;
            const issueBody = `## Training Failure Report
            
            **Run Number**: #${runNumber}
            **Failure Type**: ${failureType}
            **Workflow**: [View Run](${runUrl})
            **Failed Step**: ${failedStep?.name || 'Unknown'}
            **Timestamp**: ${new Date().toISOString()}
            **Duration**: ${failedJob?.completed_at ? Math.round((new Date(failedJob.completed_at) - new Date(failedJob.started_at)) / 1000 / 60) : 'N/A'} minutes
            
            ### Failure Analysis
            
            ${failureDetails}
            
            ### Suggested Actions
            
            ${suggestedActions.map(action => `- [ ] ${action}`).join('\n')}
            
            ### Workflow Context
            
            - **Branch**: ${context.ref}
            - **Commit**: ${context.sha.substring(0, 7)}
            - **Actor**: ${context.actor}
            - **Event**: ${context.eventName}
            - **Conclusion**: ${run.data.conclusion}
            
            ### Quick Links
            
            - [View Full Logs](${runUrl})
            - [View Failed Job](${jobUrl})
            - [Repository](https://github.com/${context.repo.owner}/${context.repo.repo})
            - [Recent Runs](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/train.yml)
            
            ---
            
            *This issue was automatically created by the training workflow. Close this issue once the problem is resolved.*`;
            
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'training-failure',
              per_page: 20,
              sort: 'created',
              direction: 'desc'
            });
            
            const duplicateIssue = issues.data.find(issue => 
              issue.title.includes(`Training Run #${runNumber}`)
            );
            
            if (duplicateIssue) {
              console.log(`Issue already exists for run #${runNumber}: ${duplicateIssue.html_url}`);
              return;
            }
            
            const recentSimilarIssues = issues.data.filter(issue => 
              issue.title.includes(`[${failureType}]`) &&
              issue.created_at > new Date(Date.now() - 3 * 60 * 60 * 1000).toISOString()
            );
            
            if (recentSimilarIssues.length > 0) {
              const existingIssue = recentSimilarIssues[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `## Additional Failure: Run #${runNumber}
            
            Another ${failureType.toLowerCase()} occurred.
            
            - **Run**: [#${runNumber}](${runUrl})
            - **Timestamp**: ${new Date().toISOString()}
            - **Duration**: ${failedJob?.completed_at ? Math.round((new Date(failedJob.completed_at) - new Date(failedJob.started_at)) / 1000 / 60) : 'N/A'} minutes
            
            This appears to be a recurring issue. Please prioritize investigation.`
              });
              console.log(`Added comment to existing issue #${existingIssue.number}`);
            } else {
              const newIssue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: issueBody,
                labels: ['training-failure', 'automated', failureType.toLowerCase().replace(/ /g, '-')]
              });
              console.log(`Created new issue: ${newIssue.data.html_url}`);
            }
