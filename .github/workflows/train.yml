name: FinAI Training Engine

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      force_seed:
        description: 'Nuke and Re-seed HF Repo?'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: "1. Verify & Lint"
    permissions:
      contents: write
    runs-on: ubuntu-latest
    environment: branch
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Check & Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy isort
          pip install -r requirements.txt
      
      - name: Linting Check Via Ruff
        run: ruff check . --exclude legacy
      
      - name: Formatting Check Via Black
        run: black --check . --exclude legacy
      
      - name: Auto-Fix if Linting Failed
        if: failure()
        run: |
          echo "Linting failed, attempting auto-fix..."
          ruff check . --fix --exclude legacy || true
          isort .
          black . --exclude legacy
          
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-fix linting issues [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "Changes pushed. A new workflow will be triggered."
          else
            echo "No changes to push."
          fi
      
      - name: Type Checking Via MyPy
        env:
          PYTHONPATH: .
        run: mypy --ignore-missing-imports --exclude legacy .

  seed:
    name: "2. Nuke & Seed HF"
    needs: verify
    if: github.event.inputs.force_seed == 'true'
    runs-on: ubuntu-latest
    environment: branch
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Critical Deps
        run: pip install huggingface_hub transformers torch datasets python-dotenv
      - name: Run Nuke & Seed
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/seed_hf_repo.py

  train:
    name: "3. Distributed Training"
    needs: [verify, seed]
    if: |
      always() && 
      needs.verify.result == 'success' && 
      (needs.seed.result == 'success' || needs.seed.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: write
    environment: branch
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install Dependencies
        run: pip install -r requirements.txt
      
      - name: Pull Model State
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import snapshot_download
          import os
          try:
              snapshot_download(repo_id='MeridianAlgo/FinAI-Lite', local_dir='./checkpoints_next/model', token=os.getenv('HF_TOKEN'))
              print('State pulled from HF')
          except Exception as e:
              print(f'Fresh start required: {e}')
          "

      - name: Execute Training Loop
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          COMET_API_KEY: ${{ secrets.COMET_API_KEY }}
          MAX_STEPS: 200
          TOTAL_STEPS: 100000
          PYTHONPATH: .
        run: python train.py

      - name: Upload Training State (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: model-checkpoint
          path: ./checkpoints_next/model/
          retention-days: 1

      - name: Update Repository State
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add dataset_state.json
          git commit -m "chore: sync dataset state [skip ci]" || echo "No changes"
          git pull --rebase -X theirs origin main
          git push origin main

  deploy:
    name: "4. Deploy to Hugging Face"
    needs: train
    environment:
      name: HuggingFace
      url: https://huggingface.co/MeridianAlgo/FinAI-Lite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install HF Hub
        run: pip install huggingface_hub
      
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: model-checkpoint
          path: ./model_to_upload
      
      - name: Push to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import HfApi
          import os
          api = HfApi()
          api.upload_folder(
              folder_path='./model_to_upload',
              repo_id='MeridianAlgo/FinAI-Lite',
              commit_message='Hourly deployment via GitHub Engine',
              token=os.getenv('HF_TOKEN')
          )
          "
