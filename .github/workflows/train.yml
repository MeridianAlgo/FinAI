name: Train Fin.AI

on:
  push:
    branches: [ "main" ]
  # Hourly training
  schedule:
    - cron: '0 * * * *'
  
  # Manual trigger only
  workflow_dispatch:
    inputs:
      max_steps:
        description: 'Maximum training steps'
        required: false
        default: '500'

env:
  PYTHON_VERSION: '3.10'
  HF_REPO_ID: 'MeridianAlgo/Fin.AI'

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
      
      - name: Cache Hugging Face datasets
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/datasets
          key: hf-datasets-${{ hashFiles('config/datasets.yaml') }}
          restore-keys: |
            hf-datasets-
      
      - name: Download model from Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python << 'EOF'
          import os
          from huggingface_hub import hf_hub_download, list_repo_files, HfApi
          
          token = os.environ.get("HF_TOKEN")
          repo_id = "${{ env.HF_REPO_ID }}"
          
          if not token:
              print("No HF_TOKEN found, starting fresh")
              exit(0)
          
          api = HfApi(token=token)
          
          try:
              files = list_repo_files(repo_id, token=token)
              print(f"Found files in {repo_id}: {files}")
              
              os.makedirs("checkpoints/model", exist_ok=True)
              
              # Download model files
              for f in files:
                  if f.endswith(('.pt', '.json')):
                      print(f"Downloading {f}...")
                      try:
                          hf_hub_download(
                              repo_id=repo_id,
                              filename=f,
                              local_dir="checkpoints/model",
                              token=token
                          )
                          print(f"✓ Downloaded {f}")
                      except Exception as e:
                          print(f"✗ Failed to download {f}: {e}")
              
              print("Model download complete!")
          except Exception as e:
              print(f"Could not download model: {e}")
              print("Starting fresh training...")
          EOF
      
      - name: Setup Wandb
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
        run: |
          if [ -n "$WANDB_API_KEY" ]; then
            wandb login $WANDB_API_KEY
          fi
      
      - name: Train model
        id: train
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WANDB_PROJECT: "fin-ai"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          MAX_STEPS="${{ github.event.inputs.max_steps || '500' }}"
          
          python train.py \
            --config config/model_config.yaml \
            --datasets config/datasets.yaml \
            --max-steps $MAX_STEPS \
            --output-dir checkpoints 2>&1 | tee training_output.txt
          
          # Extract training info
          echo "TRAINING_OUTPUT<<EOF" >> $GITHUB_OUTPUT
          tail -30 training_output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Upload model to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python << 'EOF'
          import os
          import json
          from datetime import datetime
          from huggingface_hub import HfApi, create_repo
          
          token = os.environ.get("HF_TOKEN")
          repo_id = "${{ env.HF_REPO_ID }}"
          
          if not token:
              print("No HF_TOKEN found, skipping upload")
              exit(0)
          
          api = HfApi(token=token)
          
          # Create repo if it doesn't exist
          try:
              create_repo(repo_id, token=token, exist_ok=True, repo_type="model")
              print(f"Repository {repo_id} ready")
          except Exception as e:
              print(f"Repo creation note: {e}")
          
          # Create model card
          model_card = """---
          license: mit
          tags:
            - pytorch
            - gpt2
            - text-generation
            - fin-ai
          ---
          
          # Fin.AI
          
          A lightweight, trainable GPT-style language model with automated daily training.
          
          ## Model Details
          
          - **Architecture**: GPT-2 style transformer
          - **Parameters**: ~10M (tiny preset)
          - **Training**: Daily automated training via GitHub Actions
          - **Datasets**: Rotating daily (WikiText, TinyStories, CNN, etc.)
          
          ## Usage
          
          ```python
          from fin_ai.model import FinAIModel
          
          model = FinAIModel.from_pretrained("MeridianAlgo/Fin.AI")
          ```
          
          ## Training Info
          
          - **Last Updated**: {date}
          - **Run Number**: {run}
          - **Version**: {version}
          
          ## Links
          
          - [GitHub Repository](https://github.com/MeridianAlgo/FinAI)
          - [Training Logs](https://wandb.ai/meridianalgo-meridianalgo/fin-ai)
          
          ## License
          
          MIT License
          """.format(
              date=datetime.now().strftime("%Y-%m-%d"),
              run="${{ github.run_number }}",
              version="${{ github.run_number }}"
          )
          
          # Save model card
          with open("checkpoints/model/README.md", "w") as f:
              f.write(model_card)
          
          # Upload to HF
          print(f"Uploading to {repo_id}...")
          api.upload_folder(
              folder_path="checkpoints/model",
              repo_id=repo_id,
              token=token,
              commit_message=f"Training update - Run ${{ github.run_number }} - {datetime.now().strftime('%Y-%m-%d')}"
          )
          print(f"Model uploaded to https://huggingface.co/{repo_id}")
          EOF
      
      - name: Get version
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          VERSION=${LATEST_TAG#v}
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)
          PATCH=$((PATCH + 1))
          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          DAY_OF_WEEK=$(date +%u)
          echo "DAY_OF_WEEK=$DAY_OF_WEEK" >> $GITHUB_OUTPUT
          WEEK_NUM=$(date +%V)
          echo "WEEK_NUM=$WEEK_NUM" >> $GITHUB_OUTPUT
      
      - name: Update version and commit
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          
          # Save version info (small file, no LFS needed)
          mkdir -p checkpoints
          cat > checkpoints/version.json << EOF
          {
            "version": "${{ steps.version.outputs.NEW_VERSION }}",
            "trained_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "run_number": ${{ github.run_number }},
            "hf_repo": "${{ env.HF_REPO_ID }}"
          }
          EOF
          
          git add checkpoints/version.json
          
          if ! git diff --quiet --cached; then
            git commit -m "🤖 Training ${{ steps.version.outputs.NEW_VERSION }} - $(date +'%Y-%m-%d') [skip ci]"
            git tag -a "${{ steps.version.outputs.NEW_VERSION }}" -m "Training run ${{ github.run_number }}"
            git push origin main --tags
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create weekly release (Sundays)
        if: steps.version.outputs.DAY_OF_WEEK == '7'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.NEW_VERSION }}
          name: "Fin.AI Weekly Release ${{ steps.version.outputs.NEW_VERSION }}"
          body: |
            ## 🤖 Fin.AI Weekly Training Summary
            
            **Week ${{ steps.version.outputs.WEEK_NUM }} Complete!**
            
            ### 📦 Model Location
            **Hugging Face**: [MeridianAlgo/Fin.AI](https://huggingface.co/MeridianAlgo/Fin.AI)
            
            ### 📊 Training Stats
            - **Version**: ${{ steps.version.outputs.NEW_VERSION }}
            - **Run Number**: ${{ github.run_number }}
            
            ### 📚 Datasets Trained This Week
            - Monday: WikiText-2
            - Tuesday: TinyStories
            - Wednesday: CNN News
            - Thursday: Dolly
            - Friday: arXiv
            - Saturday: SQuAD
            - Sunday: WikiText-103
            
            ### 🚀 Usage
            ```python
            from huggingface_hub import hf_hub_download
            
            # Download model
            hf_hub_download("MeridianAlgo/Fin.AI", "model.pt", local_dir="./model")
            ```
            
            ### 📈 Training Output
            ```
            ${{ steps.train.outputs.TRAINING_OUTPUT }}
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
