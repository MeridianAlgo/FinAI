name: Train Fin.AI

on:
  # Hourly training
  schedule:
    - cron: '0 * * * *'
  
  # Manual trigger
  workflow_dispatch:
    inputs:
      max_steps:
        description: 'Maximum training steps'
        required: false
        default: '1000'

env:
  PYTHON_VERSION: '3.10'
  HF_REPO_ID: 'MeridianAlgo/Fin.AI'

# Ensure only one training run at a time
concurrency:
  group: fin-ai-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: write
    
    steps:
      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h
          
          # Remove unnecessary packages and free up space
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          sudo apt-get clean
          
          echo "Disk space after cleanup:"
          df -h
      
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Cache Hugging Face
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            /tmp/hf_cache
            /tmp/hf_home
          key: ${{ runner.os }}-hf-${{ hashFiles('requirements.txt', 'config/datasets.yaml', 'config/model_config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-hf-
      
      - name: Download model from Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python << 'EOF'
          import os
          from huggingface_hub import hf_hub_download, list_repo_files, HfApi
          
          token = os.environ.get("HF_TOKEN")
          repo_id = "${{ env.HF_REPO_ID }}"
          
          if not token:
              print("No HF_TOKEN found, starting fresh")
              exit(0)
          
          api = HfApi(token=token)
          
          try:
              files = list_repo_files(repo_id, token=token)
              print(f"Found files in {repo_id}: {files}")
              
              os.makedirs("checkpoints/model", exist_ok=True)
              
              # Download v3 model files (safetensors format)
              required_files = ['config.json']
              optional_files = ['model.safetensors', 'pytorch_model.bin', 'version.json', 'README.md', 'generation_config.json']
              
              for f in required_files:
                  if f in files:
                      print(f"Downloading {f}...")
                      try:
                          hf_hub_download(
                              repo_id=repo_id,
                              filename=f,
                              local_dir="checkpoints/model",
                              token=token
                          )
                          print(f"✓ Downloaded {f}")
                      except Exception as e:
                          print(f"✗ Failed to download {f}: {e}")
                          print("Will start fresh training...")
                          exit(0)
                  else:
                      print(f"⚠️  Required file {f} not found in repo")
                      print("Will start fresh training...")
                      # For v3 migration, missing config means fresh start
                      exit(0)
              
              # Download optional files
              for f in optional_files:
                  if f in files:
                      try:
                          hf_hub_download(
                              repo_id=repo_id,
                              filename=f,
                              local_dir="checkpoints/model",
                              token=token
                          )
                          print(f"✓ Downloaded {f}")
                      except Exception as e:
                          print(f"Note: Could not download {f}: {e}")
              
              print("✅ Model download complete! Will continue training from checkpoint.")
          except Exception as e:
              print(f"Could not download model: {e}")
              print("Starting fresh training...")
          EOF

      - name: Smoke test downloaded model
        run: |
          python << 'EOF'
          import os
          import torch
          from transformers import AutoTokenizer
          from fin_ai.model import FinAIForCausalLM

          model_dir = os.path.join("checkpoints", "model")
          if not os.path.exists(os.path.join(model_dir, "config.json")):
              print("No downloaded model found, skipping smoke test")
              raise SystemExit(0)

          model = FinAIForCausalLM.from_pretrained(model_dir)
          model.eval()
          tok = AutoTokenizer.from_pretrained("gpt2")
          if tok.pad_token is None:
              tok.pad_token = tok.eos_token

          prompt = "The market"
          inputs = tok(prompt, return_tensors="pt")
          with torch.no_grad():
              _ = model(**inputs, labels=inputs["input_ids"])
              out = model.generate(**inputs, max_new_tokens=8, do_sample=False)
          print(tok.decode(out[0], skip_special_tokens=True))
          EOF
      
      - name: Setup Comet ML
        env:
          COMET_API_KEY: ${{ secrets.COMET_API_KEY }}
        run: |
          if [ -z "$COMET_API_KEY" ]; then
            echo "COMET_API_KEY not set; disabling Comet ML for this run"
            echo "COMET_DISABLE=true" >> $GITHUB_ENV
            exit 0
          fi

          echo "Setting up Comet ML..."
          echo "COMET_API_KEY=$COMET_API_KEY" >> $GITHUB_ENV

      - name: Train model
        id: train
        env:
          COMET_API_KEY: ${{ secrets.COMET_API_KEY }}
          COMET_PROJECT_NAME: "fin-ai"
          COMET_WORKSPACE: "meridianalgo"
          TOKENIZERS_PARALLELISM: "false"
          HF_DATASETS_CACHE: "/tmp/hf_cache"
          HF_HOME: "/tmp/hf_home"
          HF_DATASETS_TRUST_REMOTE_CODE: "1"
          HF_DATASETS_OFFLINE: "0"
          TMPDIR: "/tmp"
        run: |
          set -o pipefail
          MAX_STEPS="${{ github.event.inputs.max_steps || '1000' }}"
          
          # Create temp cache directories
          mkdir -p /tmp/hf_cache
          mkdir -p /tmp/hf_home
          
          # Monitor disk space during training
          echo "Disk space before training:"
          df -h
          
          # Set timeout for training (90 minutes max)
          # We use pipefail to catch errors in train.py even when piped to tee
          set +e
          timeout 90m python train.py \
            --config config/model_config.yaml \
            --datasets config/datasets.yaml \
            --size-preset micro \
            --max-steps $MAX_STEPS \
            --output-dir checkpoints 2>&1 | tee training_output.txt
          TRAIN_STATUS=$?
          set -e

          if [ $TRAIN_STATUS -eq 0 ]; then
            echo "✅ Training completed successfully"
          elif [ $TRAIN_STATUS -eq 124 ]; then
            echo "❌ Training timed out after 90 minutes"
            exit 124
          else
            echo "❌ Training failed with exit code $TRAIN_STATUS"
            exit $TRAIN_STATUS
          fi
          
          # Extract training info
          echo "TRAINING_OUTPUT<<EOF" >> $GITHUB_OUTPUT
          tail -30 training_output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Show disk usage after training
          echo "Disk space after training:"
          df -h
      
      - name: Clean up cache after training
        if: always()
        run: |
          echo "Aggressive cache cleanup to free disk space..."
          echo "Preserving Hugging Face caches for actions/cache"
          
          # Clean pip cache
          pip cache purge || true
          
          # Clean only our temp files, not system directories
          find /tmp -maxdepth 1 -type f -user runner -delete 2>/dev/null || true
          find /tmp -maxdepth 1 -type d -user runner -name "tmp*" -exec rm -rf {} + 2>/dev/null || true
          
          echo "Cache cleaned!"
          df -h
      
      - name: Upload model to Hugging Face
        if: success()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python << 'EOF'
          import os
          import json
          from datetime import datetime
          from huggingface_hub import HfApi, create_repo
          
          token = os.environ.get("HF_TOKEN")
          repo_id = "${{ env.HF_REPO_ID }}"
          
          if not token:
              print("No HF_TOKEN found, skipping upload")
              exit(0)
          
          api = HfApi(token=token)
          
          # Create repo if it doesn't exist
          try:
              create_repo(repo_id, token=token, exist_ok=True, repo_type="model")
              print(f"Repository {repo_id} ready")
          except Exception as e:
              print(f"Repo creation note: {e}")
          
          # Copy model card to model directory as README
          if os.path.exists("MODEL_CARD.md"):
              import shutil
              shutil.copy("MODEL_CARD.md", "checkpoints/model/README.md")
              print("✅ Copied MODEL_CARD.md to model directory as README.md")
          elif os.path.exists("README.md"):
              import shutil
              shutil.copy("README.md", "checkpoints/model/README.md")
              print("✅ Copied README.md to model directory")
          
          # Copy generation config if it exists
          if os.path.exists("fin_ai/model/generation_config.json"):
              import shutil
              shutil.copy("fin_ai/model/generation_config.json", "checkpoints/model/generation_config.json")
              print("✅ Copied generation_config.json to model directory")

          # Copy remote-code modules required for AutoModel* loading
          import shutil
          shutil.copy("fin_ai/model/configuration_finai.py", "checkpoints/model/configuration_finai.py")
          shutil.copy("fin_ai/model/modeling_finai.py", "checkpoints/model/modeling_finai.py")
          shutil.copy("fin_ai/model/__init__.py", "checkpoints/model/__init__.py")
          print("✅ Copied remote-code modules to model directory")

          # Ensure config.json contains auto_map for trust_remote_code
          config_path = os.path.join("checkpoints", "model", "config.json")
          if os.path.exists(config_path):
              with open(config_path, "r", encoding="utf-8") as f:
                  cfg = json.load(f)

              cfg["auto_map"] = {
                  "AutoConfig": "configuration_finai.FinAIConfig",
                  "AutoModelForCausalLM": "modeling_finai.FinAIForCausalLM",
              }
              cfg.setdefault("architectures", [])
              if "FinAIForCausalLM" not in cfg["architectures"]:
                  cfg["architectures"].append("FinAIForCausalLM")

              with open(config_path, "w", encoding="utf-8") as f:
                  json.dump(cfg, f, indent=2)
              print("✅ Updated config.json with auto_map")
          
          # Verify V3 files exist
          model_dir = "checkpoints/model"
          required_files = ["config.json"]
          model_files = ["model.safetensors", "pytorch_model.bin"]
          
          print("\n📦 Checking V3 model files...")
          for f in required_files:
              path = os.path.join(model_dir, f)
              if os.path.exists(path):
                  print(f"  ✅ {f}")
              else:
                  print(f"  ❌ Missing: {f}")
          
          has_model = False
          for f in model_files:
              path = os.path.join(model_dir, f)
              if os.path.exists(path):
                  print(f"  ✅ {f}")
                  has_model = True
                  break
          
          if not has_model:
              print("  ⚠️  No model weights found (model.safetensors or pytorch_model.bin)")
          
          # Upload to HF
          print(f"\n📤 Uploading to {repo_id}...")
          
          api.upload_folder(
              folder_path="checkpoints/model",
              repo_id=repo_id,
              token=token,
              commit_message=f"V3 Training - Run #${{ github.run_number }} - {datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC')}",
              ignore_patterns=["*.pt", "checkpoint-*.pt"]  # Don't upload training checkpoints
          )
          print(f"✅ Model uploaded to https://huggingface.co/{repo_id}")
          
          # Clean up legacy V2 files if they exist
          print("\n🧹 Cleaning up legacy V2 files...")
          legacy_files = ["final_config.json", "model.pt"]
          for file_path in legacy_files:
              try:
                  api.delete_file(
                      path_in_repo=file_path,
                      repo_id=repo_id,
                      token=token,
                      commit_message=f"Remove legacy V2 file: {file_path}"
                  )
                  print(f"  ✅ Deleted: {file_path}")
              except Exception as e:
                  # File might not exist, which is fine
                  if "404" not in str(e):
                      print(f"  ℹ️  {file_path}: {e}")
          
          print("\n✨ Upload complete!")
          EOF
      
      - name: Update version and push
        if: success()
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          
          # Stash local changes (like dataset_state.json) before pulling
          # If stash fails, it just means no changes to stash
          git add .
          git stash || echo "Nothing to stash"
          
          # Pull latest changes to avoid conflicts
          git fetch origin main
          git pull --rebase origin main
          
          # Restore local changes
          # If pop fails (e.g. merge conflict), we force it to keep local version
          # This avoids corrupted files with merge markers
          if ! git stash pop; then
             echo "⚠️ Merge conflict during stash pop, favoring local changes"
             git checkout --ours . || git checkout --theirs . || true
          fi
          
          # Get run number for versioning
          RUN_NUM=${{ github.run_number }}
          
          # Output for other steps
          echo "RUN_NUM=$RUN_NUM" >> $GITHUB_OUTPUT
          DAY_OF_WEEK=$(date +%u)
          echo "DAY_OF_WEEK=$DAY_OF_WEEK" >> $GITHUB_OUTPUT
          WEEK_NUM=$(date +%V)
          echo "WEEK_NUM=$WEEK_NUM" >> $GITHUB_OUTPUT
          
          # Check if this is a release run (every 15 runs)
          if [ $((RUN_NUM % 15)) -eq 0 ]; then
            echo "SHOULD_RELEASE=true" >> $GITHUB_OUTPUT
            # Calculate version for releases only
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
            VERSION=${LATEST_TAG#v}
            MAJOR=$(echo $VERSION | cut -d. -f1)
            MINOR=$(echo $VERSION | cut -d. -f2)
            PATCH=$(echo $VERSION | cut -d. -f3)
            PATCH=$((PATCH + 1))
            NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
            echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          else
            echo "SHOULD_RELEASE=false" >> $GITHUB_OUTPUT
          fi
          
          # Save version info (no version tag, just run number)
          mkdir -p checkpoints
          cat > checkpoints/version.json << EOF
          {
            "run_number": $RUN_NUM,
            "trained_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "hf_repo": "${{ env.HF_REPO_ID }}"
          }
          EOF
          
          # Add checkpoint files for continuous training
          git add checkpoints/checkpoint-*.pt 2>/dev/null || true
          git add checkpoints/version.json
          git add checkpoints/dataset_state.json || true
          
          if ! git diff --quiet --cached; then
            git commit -m "Training run #$RUN_NUM - FineWeb-Edu - $(date +'%Y-%m-%d') [skip ci]"
            git push origin main
          fi
      
      - name: Create release every 15 runs
        if: steps.version.outputs.SHOULD_RELEASE == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.NEW_VERSION }}
          name: "Fin.AI Release ${{ steps.version.outputs.NEW_VERSION }}"
          body: |
            # Fin.AI Release ${{ steps.version.outputs.NEW_VERSION }}
            
            ## Release Information
            
            This release represents a training milestone after 15 continuous hourly training runs on FineWeb-Edu.
            
            ### Model Availability
            
            [![Model on Hugging Face](https://img.shields.io/badge/🤗_Model-Fin.AI-yellow)](https://huggingface.co/MeridianAlgo/Fin.AI)
            [![Training Workflow](https://github.com/MeridianAlgo/FinAI/actions/workflows/train.yml/badge.svg)](https://github.com/MeridianAlgo/FinAI/actions/workflows/train.yml)
            [![Comet ML](https://img.shields.io/badge/Comet_ML-Experiments-blue?logo=comet)](https://www.comet.com/meridianalgo/fin-ai)
            
            **Hugging Face Repository**: [MeridianAlgo/Fin.AI](https://huggingface.co/MeridianAlgo/Fin.AI)
            
            ### Training Statistics
            
            | Metric | Value |
            |--------|-------|
            | Release Version | ${{ steps.version.outputs.NEW_VERSION }} |
            | Total Training Runs | ${{ github.run_number }} |
            | Steps Per Run | 1000 |
            | Total Steps | ~${{ github.run_number }}000 |
            | Model Size | ~16M parameters (micro preset) |
            | Training Frequency | Hourly |
            | Dataset | FineWeb-Edu (continuous) |
            
            ### Model Architecture
            
            - **Type**: GPT-style decoder-only transformer
            - **Attention**: Grouped Query Attention (GQA)
            - **Position Encoding**: Rotary Position Embeddings (RoPE)
            - **Activation**: SwiGLU
            - **Normalization**: RMSNorm
            - **Format**: SafeTensors
            
            ### Installation and Usage
            
            ```bash
            pip install transformers torch huggingface_hub
            ```
            
            ```python
            from transformers import AutoModelForCausalLM, AutoTokenizer
            import torch
            
            # Load model from Hugging Face
            model = AutoModelForCausalLM.from_pretrained(
                "MeridianAlgo/Fin.AI",
                trust_remote_code=True,
                torch_dtype=torch.float32
            )
            tokenizer = AutoTokenizer.from_pretrained("gpt2")
            
            if tokenizer.pad_token is None:
                tokenizer.pad_token = tokenizer.eos_token
            
            # Generate text
            prompt = "The future of artificial intelligence is"
            inputs = tokenizer(prompt, return_tensors="pt")
            
            with torch.no_grad():
                outputs = model.generate(
                    **inputs,
                    max_length=100,
                    temperature=0.8,
                    top_p=0.95,
                    do_sample=True,
                    pad_token_id=tokenizer.pad_token_id
                )
            
            print(tokenizer.decode(outputs[0], skip_special_tokens=True))
            ```
            
            ### Latest Training Output
            
            ```
            ${{ steps.train.outputs.TRAINING_OUTPUT }}
            ```
            
            ### Resources
            
            - **Documentation**: [GitHub Repository](https://github.com/MeridianAlgo/FinAI)
            - **Training Metrics**: [Comet ML Dashboard](https://www.comet.com/meridianalgo/fin-ai)
            - **Model Card**: [Hugging Face Model Card](https://huggingface.co/MeridianAlgo/Fin.AI)
            - **Issues**: [Report Issues](https://github.com/MeridianAlgo/FinAI/issues)
            
            ### Notes
            
            This is an experimental research model under continuous development. The model trains hourly on FineWeb-Edu (high-quality educational content) and may produce inaccurate or biased outputs. Not recommended for production use.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create issue on training failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runNumber = context.runNumber;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            
            const issueTitle = `Training Run #${runNumber} Failed`;
            const issueBody = `## Training Failure Report
            
            **Run Number**: #${runNumber}
            **Workflow**: [View Run](${runUrl})
            **Timestamp**: ${new Date().toISOString()}
            
            ### Details
            
            The automated training workflow has failed. Please review the workflow logs for details.
            
            ### Action Items
            
            - [ ] Review workflow logs
            - [ ] Identify root cause
            - [ ] Apply fix
            - [ ] Re-run workflow if needed
            
            ### Workflow Information
            
            - **Branch**: ${context.ref}
            - **Commit**: ${context.sha.substring(0, 7)}
            - **Actor**: ${context.actor}
            
            ---
            
            *This issue was automatically created by the training workflow.*`;
            
            // Check if similar issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'training-failure',
              per_page: 10
            });
            
            const recentIssue = issues.data.find(issue => 
              issue.title.includes(`Training Run #${runNumber}`)
            );
            
            if (!recentIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: issueBody,
                labels: ['training-failure', 'automated']
              });
              console.log('Issue created for training failure');
            } else {
              console.log('Issue already exists for this run');
            }
