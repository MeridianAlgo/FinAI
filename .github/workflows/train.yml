name: Hourly FinAI Training

on:
  schedule:
    - cron: '0 * * * *' # Hourly
  workflow_dispatch: # Manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Model from HF (Optional)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import HfApi, snapshot_download
          import os
          repo_id = 'MeridianAlgo/FinAI-Lite'
          print(f'Attempting to download from {repo_id}...')
          try:
              snapshot_download(repo_id=repo_id, local_dir='./checkpoints_next/model', token=os.getenv('HF_TOKEN'))
              print('Model downloaded successfully')
          except Exception as e:
              print(f'No model found or error: {e}')
          "
          echo "Directory content after download:"
          ls -R ./checkpoints_next || echo "Directory does not exist"

      - name: Run Training
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          COMET_API_KEY: ${{ secrets.COMET_API_KEY }}
          MAX_STEPS: 200
          TOTAL_STEPS: 100000
          PYTHONPATH: .
        run: |
          python train.py

      - name: Debug Output
        run: |
          echo "Directory content after training:"
          ls -R ./checkpoints_next
          if [ -f "dataset_state.json" ]; then
            cat dataset_state.json
          fi

      - name: Upload Model to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import HfApi
          import os
          api = HfApi()
          repo_id = 'MeridianAlgo/FinAI-Lite'
          api.upload_folder(
              folder_path='./checkpoints_next/model',
              repo_id=repo_id,
              commit_message='Hourly training update',
              token=os.getenv('HF_TOKEN')
          )
          "

      - name: Commit and Push State
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add dataset_state.json
          git commit -m "Update dataset state [skip ci]" || echo "No changes to commit"
          git pull --rebase -X theirs origin main
          git push origin main
