name: Train Fin.AI

on:
  # Every 85 minutes (56 min training + 29 min buffer)
  # Runs at: 00:00, 01:25, 02:50, 04:15, 05:40, 07:05, 08:30, 09:55, 11:20, 12:45, 14:10, 15:35, 17:00, 18:25, 19:50, 21:15, 22:40
  schedule:
    - cron: '0 0,7,14,21 * * *'       # Hours: 0, 7, 14, 21 at minute 0
    - cron: '25 1,8,15,22 * * *'      # Hours: 1, 8, 15, 22 at minute 25
    - cron: '50 2,9,16,23 * * *'      # Hours: 2, 9, 16, 23 at minute 50
    - cron: '15 4,11,18 * * *'        # Hours: 4, 11, 18 at minute 15
    - cron: '40 5,12,19 * * *'        # Hours: 5, 12, 19 at minute 40
  
  # Manual trigger
  workflow_dispatch:
    inputs:
      max_steps:
        description: 'Maximum training steps'
        required: false
        default: '800'

env:
  PYTHON_VERSION: '3.10'
  HF_REPO_ID: 'MeridianAlgo/Fin.AI'

# Ensure only one training run at a time
concurrency:
  group: fin-ai-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    
    steps:
      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h
          
          # Remove unnecessary packages and free up space
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          sudo apt-get clean
          
          echo "Disk space after cleanup:"
          df -h
      
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
      
      - name: Download model from Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python << 'EOF'
          import os
          from huggingface_hub import hf_hub_download, list_repo_files, HfApi
          
          token = os.environ.get("HF_TOKEN")
          repo_id = "${{ env.HF_REPO_ID }}"
          
          if not token:
              print("No HF_TOKEN found, starting fresh")
              exit(0)
          
          api = HfApi(token=token)
          
          try:
              files = list_repo_files(repo_id, token=token)
              print(f"Found files in {repo_id}: {files}")
              
              os.makedirs("checkpoints/model", exist_ok=True)
              
              # Download v3 model files (safetensors format)
              required_files = ['config.json']
              optional_files = ['model.safetensors', 'pytorch_model.bin', 'version.json', 'README.md', 'generation_config.json']
              
              for f in required_files:
                  if f in files:
                      print(f"Downloading {f}...")
                      try:
                          hf_hub_download(
                              repo_id=repo_id,
                              filename=f,
                              local_dir="checkpoints/model",
                              token=token
                          )
                          print(f"✓ Downloaded {f}")
                      except Exception as e:
                          print(f"✗ Failed to download {f}: {e}")
                          print("Will start fresh training...")
                          exit(0)
                  else:
                      print(f"⚠️  Required file {f} not found in repo")
                      print("Will start fresh training...")
                      # For v3 migration, missing config means fresh start
                      exit(0)
              
              # Download optional files
              for f in optional_files:
                  if f in files:
                      try:
                          hf_hub_download(
                              repo_id=repo_id,
                              filename=f,
                              local_dir="checkpoints/model",
                              token=token
                          )
                          print(f"✓ Downloaded {f}")
                      except Exception as e:
                          print(f"Note: Could not download {f}: {e}")
              
              print("✅ Model download complete! Will continue training from checkpoint.")
          except Exception as e:
              print(f"Could not download model: {e}")
              print("Starting fresh training...")
          EOF
      
      - name: Setup Wandb
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
        run: |
          if [ -z "$WANDB_API_KEY" ]; then
            echo "❌ ERROR: WANDB_API_KEY is not set in repository secrets."
            echo "Training cannot proceed without logging. Stopping action."
            exit 1
          fi
          
          echo "Setting up Wandb..."
          if wandb login --relogin "$WANDB_API_KEY"; then
            echo "✅ Wandb configured successfully"
          else
            echo "❌ ERROR: Wandb login failed. Check your API key. Stopping action."
            exit 1
          fi
      
      - name: Clean up incompatible checkpoints
        run: |
          echo "🧹 Checking for incompatible checkpoints..."
          if [ -f "checkpoints/model/model.safetensors" ] || [ -f "checkpoints/model/model.pt" ]; then
            # Check if it's GPT-2 architecture by looking at config
            if [ -f "checkpoints/model/config.json" ]; then
              if grep -q '"model_type".*"gpt2"' checkpoints/model/config.json; then
                echo "⚠️  Found incompatible GPT-2 checkpoint, removing..."
                rm -rf checkpoints/model
                echo "✅ Cleaned up incompatible checkpoint"
              else
                echo "✅ Checkpoint appears compatible"
              fi
            fi
          else
            echo "ℹ️  No existing checkpoint found"
          fi
      
      - name: Train model
        id: train
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WANDB_PROJECT: "fin-ai"
          WANDB_SILENT: "true"
          TOKENIZERS_PARALLELISM: "false"
          HF_DATASETS_CACHE: "/tmp/hf_cache"
          HF_HOME: "/tmp/hf_home"
          HF_DATASETS_TRUST_REMOTE_CODE: "1"
          HF_DATASETS_OFFLINE: "0"
          TMPDIR: "/tmp"
        run: |
          MAX_STEPS="${{ github.event.inputs.max_steps || '800' }}"
          
          # Create temp cache directories
          mkdir -p /tmp/hf_cache
          mkdir -p /tmp/hf_home
          
          # Monitor disk space during training
          echo "Disk space before training:"
          df -h
          
          # Set timeout for training (80 minutes max)
          timeout 80m python train.py \
            --config config/model_config.yaml \
            --datasets config/datasets.yaml \
            --max-steps $MAX_STEPS \
            --output-dir checkpoints 2>&1 | tee training_output.txt || {
              echo "Training completed or timed out"
              echo "Exit code: $?"
          }
          
          # Clean cache immediately after training to free space
          echo "Cleaning cache to free disk space..."
          rm -rf /tmp/hf_cache/* || true
          rm -rf /tmp/hf_home/* || true
          
          # Extract training info
          echo "TRAINING_OUTPUT<<EOF" >> $GITHUB_OUTPUT
          tail -30 training_output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          # Show disk usage after training
          echo "Disk space after training:"
          df -h
      
      - name: Clean up cache after training
        if: always()
        run: |
          echo "Aggressive cache cleanup to free disk space..."
          rm -rf /tmp/hf_cache || true
          rm -rf /tmp/hf_home || true
          rm -rf ~/.cache/huggingface/datasets || true
          rm -rf ~/.cache/huggingface/hub || true
          rm -rf ~/.cache/huggingface/modules || true
          
          # Clean pip cache
          pip cache purge || true
          
          # Clean only our temp files, not system directories
          find /tmp -maxdepth 1 -type f -user runner -delete 2>/dev/null || true
          find /tmp -maxdepth 1 -type d -user runner -name "tmp*" -exec rm -rf {} + 2>/dev/null || true
          
          echo "Cache cleaned!"
          df -h
      
      - name: Upload model to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python << 'EOF'
          import os
          import json
          from datetime import datetime
          from huggingface_hub import HfApi, create_repo
          
          token = os.environ.get("HF_TOKEN")
          repo_id = "${{ env.HF_REPO_ID }}"
          
          if not token:
              print("No HF_TOKEN found, skipping upload")
              exit(0)
          
          api = HfApi(token=token)
          
          # Create repo if it doesn't exist
          try:
              create_repo(repo_id, token=token, exist_ok=True, repo_type="model")
              print(f"Repository {repo_id} ready")
          except Exception as e:
              print(f"Repo creation note: {e}")
          
          # Copy model card to model directory as README
          if os.path.exists("MODEL_CARD.md"):
              import shutil
              shutil.copy("MODEL_CARD.md", "checkpoints/model/README.md")
              print("✅ Copied MODEL_CARD.md to model directory as README.md")
          elif os.path.exists("README.md"):
              import shutil
              shutil.copy("README.md", "checkpoints/model/README.md")
              print("✅ Copied README.md to model directory")
          
          # Copy generation config if it exists
          if os.path.exists("fin_ai/model/generation_config.json"):
              import shutil
              shutil.copy("fin_ai/model/generation_config.json", "checkpoints/model/generation_config.json")
              print("✅ Copied generation_config.json to model directory")
          
          # Verify V3 files exist
          model_dir = "checkpoints/model"
          required_files = ["config.json"]
          model_files = ["model.safetensors", "pytorch_model.bin"]
          
          print("\n📦 Checking V3 model files...")
          for f in required_files:
              path = os.path.join(model_dir, f)
              if os.path.exists(path):
                  print(f"  ✅ {f}")
              else:
                  print(f"  ❌ Missing: {f}")
          
          has_model = False
          for f in model_files:
              path = os.path.join(model_dir, f)
              if os.path.exists(path):
                  print(f"  ✅ {f}")
                  has_model = True
                  break
          
          if not has_model:
              print("  ⚠️  No model weights found (model.safetensors or pytorch_model.bin)")
          
          # Upload to HF
          print(f"\n📤 Uploading to {repo_id}...")
          
          api.upload_folder(
              folder_path="checkpoints/model",
              repo_id=repo_id,
              token=token,
              commit_message=f"V3 Training - Run #{${{ github.run_number }}} - {datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC')}",
              ignore_patterns=["*.pt", "checkpoint-*.pt"]  # Don't upload training checkpoints
          )
          print(f"✅ Model uploaded to https://huggingface.co/{repo_id}")
          
          # Clean up legacy V2 files if they exist
          print("\n🧹 Cleaning up legacy V2 files...")
          legacy_files = ["final_config.json", "model.pt"]
          for file_path in legacy_files:
              try:
                  api.delete_file(
                      path_in_repo=file_path,
                      repo_id=repo_id,
                      token=token,
                      commit_message=f"Remove legacy V2 file: {file_path}"
                  )
                  print(f"  ✅ Deleted: {file_path}")
              except Exception as e:
                  # File might not exist, which is fine
                  if "404" not in str(e):
                      print(f"  ℹ️  {file_path}: {e}")
          
          print("\n✨ Upload complete!")
          EOF
      
      - name: Update version and push
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          
          # Stash local changes (like dataset_state.json) before pulling
          git add .
          git stash
          
          # Pull latest changes to avoid conflicts
          git fetch origin main
          git pull --rebase origin main
          
          # Restore local changes
          git stash pop || echo "No changes to restore"
          
          # Get run number for versioning
          RUN_NUM=${{ github.run_number }}
          
          # Output for other steps
          echo "RUN_NUM=$RUN_NUM" >> $GITHUB_OUTPUT
          DAY_OF_WEEK=$(date +%u)
          echo "DAY_OF_WEEK=$DAY_OF_WEEK" >> $GITHUB_OUTPUT
          WEEK_NUM=$(date +%V)
          echo "WEEK_NUM=$WEEK_NUM" >> $GITHUB_OUTPUT
          
          # Check if this is a release run (every 15 runs)
          if [ $((RUN_NUM % 15)) -eq 0 ]; then
            echo "SHOULD_RELEASE=true" >> $GITHUB_OUTPUT
            # Calculate version for releases only
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
            VERSION=${LATEST_TAG#v}
            MAJOR=$(echo $VERSION | cut -d. -f1)
            MINOR=$(echo $VERSION | cut -d. -f2)
            PATCH=$(echo $VERSION | cut -d. -f3)
            PATCH=$((PATCH + 1))
            NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
            echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          else
            echo "SHOULD_RELEASE=false" >> $GITHUB_OUTPUT
          fi
          
          # Save version info (no version tag, just run number)
          mkdir -p checkpoints
          cat > checkpoints/version.json << EOF
          {
            "run_number": $RUN_NUM,
            "trained_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "hf_repo": "${{ env.HF_REPO_ID }}"
          }
          EOF
          
          git add checkpoints/version.json
          git add checkpoints/dataset_state.json || true
          
          if ! git diff --quiet --cached; then
            git commit -m "🤖 Training run #$RUN_NUM - $(date +'%Y-%m-%d') [skip ci]"
            git push origin main
          fi
      
      - name: Create release every 15 runs
        if: steps.version.outputs.SHOULD_RELEASE == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.NEW_VERSION }}
          name: "Fin.AI Release ${{ steps.version.outputs.NEW_VERSION }}"
          body: |
            ## 🤖 Fin.AI Training Milestone
            
            **15 Training Runs Complete!**
            
            ### 📦 Model Location
            **Hugging Face**: [MeridianAlgo/Fin.AI](https://huggingface.co/MeridianAlgo/Fin.AI)
            
            ### 📊 Training Stats
            - **Version**: ${{ steps.version.outputs.NEW_VERSION }}
            - **Total Runs**: ${{ github.run_number }}
            - **Datasets Trained**: Multiple datasets cycled hourly
            
            ### 🚀 Usage
            ```python
            from transformers import AutoModelForCausalLM, AutoTokenizer
            
            # Download model directly 
            model = AutoModelForCausalLM.from_pretrained("MeridianAlgo/Fin.AI", trust_remote_code=True)
            tokenizer = AutoTokenizer.from_pretrained("MeridianAlgo/Fin.AI")
            ```
            
            ### 📈 Latest Training Output
            ```
            ${{ steps.train.outputs.TRAINING_OUTPUT }}
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
