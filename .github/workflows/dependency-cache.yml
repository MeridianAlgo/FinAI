name: Dependency Cache Warm

on:
  push:
  workflow_dispatch:

concurrency:
  group: meridian-dep-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm:
    name: Warm pip cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install (populate cache)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache status
        run: |
          python -V
          pip --version
          pip cache info || true
