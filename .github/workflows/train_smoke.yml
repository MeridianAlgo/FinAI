name: Train Smoke Test

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: "10-Step Smoke Train"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Smoke Training (tiny model)
        env:
          SMOKE_TEST: '1'
          MAX_STEPS: '10'
          TOTAL_STEPS: '10'
          GRAD_ACCUM: '1'
          BATCH_SIZE: '2'
          BLOCK_SIZE: '64'
          PYTHONPATH: .
          PYTHONUNBUFFERED: '1'
        run: |
          python train.py
