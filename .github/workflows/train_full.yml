name: Full Training (Manual)

on:
  workflow_dispatch:
    inputs:
      max_steps:
        description: 'Number of optimizer steps to run this session'
        required: false
        default: '200'
      total_steps:
        description: 'Total steps for scheduler lifecycle'
        required: false
        default: '100000'
      reset_remote_checkpoint:
        description: 'Delete checkpoint/* in the Hugging Face repo before training/upload (forces new run state)'
        type: boolean
        default: false
      start_fresh:
        description: 'Do not pull remote checkpoint before training (start from scratch locally)'
        type: boolean
        default: false
      upload_to_hf:
        description: 'Upload ./checkpoint to Hugging Face at end'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  train:
    name: "Full Training + HF Sync"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black

      - name: Lint and Format
        run: |
          black .
          ruff check . --fix

      - name: Pull Checkpoint from Hugging Face
        if: ${{ !inputs.start_fresh && !inputs.reset_remote_checkpoint }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import snapshot_download, list_repo_files
          import os, shutil

          repo_id = 'MeridianAlgo/FinAI-Lite'
          token = os.getenv('HF_TOKEN')

          files = list(list_repo_files(repo_id=repo_id, token=token))
          checkpoint_files = [f for f in files if f.startswith('checkpoint/')]
          if not checkpoint_files:
              print('No checkpoint found in repo. Starting fresh.')
              raise SystemExit(0)

          temp_dir = './temp_download'
          snapshot_download(repo_id=repo_id, local_dir=temp_dir, token=token)

          if os.path.exists(os.path.join(temp_dir, 'checkpoint')):
              if os.path.exists('./checkpoint'):
                  shutil.rmtree('./checkpoint')
              shutil.move(os.path.join(temp_dir, 'checkpoint'), './checkpoint')
              print('✓ Checkpoint moved to ./checkpoint')

          if os.path.exists(temp_dir):
              shutil.rmtree(temp_dir)
          "

      - name: Reset Remote Checkpoint (Hugging Face)
        if: ${{ inputs.reset_remote_checkpoint }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import HfApi
          import os

          repo_id = 'MeridianAlgo/FinAI-Lite'
          token = os.getenv('HF_TOKEN')
          api = HfApi(token=token)

          files = api.list_repo_files(repo_id=repo_id)
          targets = [f for f in files if f.startswith('checkpoint/')]
          if not targets:
              print('No checkpoint/* files to delete.')
              raise SystemExit(0)

          print(f'Deleting {len(targets)} checkpoint files from {repo_id}...')
          for path in targets:
              api.delete_file(
                  repo_id=repo_id,
                  path_in_repo=path,
                  commit_message='ci: reset checkpoint state [skip ci]'
              )
          print('✓ Remote checkpoint reset complete')
          "

      - name: Execute Training Loop
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          COMET_API_KEY: ${{ secrets.COMET_API_KEY }}
          SMOKE_TEST: '0'
          MAX_STEPS: ${{ inputs.max_steps }}
          TOTAL_STEPS: ${{ inputs.total_steps }}
          BATCH_SIZE: '2'
          BLOCK_SIZE: '128'
          GRAD_ACCUM: '2'
          PYTHONPATH: .
          PYTHONUNBUFFERED: '1'
        run: |
          python train.py

      - name: Upload Checkpoint to Hugging Face
        if: ${{ inputs.upload_to_hf }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import HfApi
          import os

          if not os.path.exists('./checkpoint'):
              print('No checkpoint directory found, skipping upload')
              raise SystemExit(0)

          api = HfApi()
          print('Uploading checkpoint to MeridianAlgo/FinAI-Lite...')
          api.upload_folder(
              folder_path='./checkpoint',
              repo_id='MeridianAlgo/FinAI-Lite',
              path_in_repo='checkpoint',
              commit_message='Training checkpoint update via GitHub Engine [skip ci]',
              token=os.getenv('HF_TOKEN')
          )
          print('✓ Deployment successful!')
          "

      - name: Upload Checkpoint Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-checkpoint
          path: checkpoint/
          retention-days: 1

      - name: Update Repository State
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --staged --quiet || git commit -m "chore: sync state [skip ci]"
          git pull --rebase -X theirs origin main || (git rebase --abort && git pull --no-rebase origin main)
          git push origin main
