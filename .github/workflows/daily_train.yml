name: Daily FinAI Training

on:
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight
  workflow_dispatch:      # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  train:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Fetch all history for proper pushing

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install datasets transformers accelerate

    - name: Run Daily Training
      run: |
        python scripts/train_daily_gh.py

    - name: Commit and Push Model
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "FinAI Bot"
        git config --global user.email "finai-bot@users.noreply.github.com"
        
        # Create a new branch for the update
        git checkout -B daily-training
        
        git add models/finai_gpt.pt models/tokenizer.pkl src/config.py
        git commit -m "Daily training update [skip ci]" || echo "No changes to commit"
        
        # Push to the new branch (force to overwrite previous daily runs if not merged)
        git push -f origin daily-training
        
        # Create a Pull Request
        gh pr create --title "Daily Training Update" \
                     --body "Automated daily training update. \n\nDataset: Randomly selected finance dataset." \
                     --base master \
                     --head daily-training || echo "PR might already exist"
