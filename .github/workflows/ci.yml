name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pipeline:
    name: "Consolidated CI/CD"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install All Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy isort pytest pytest-asyncio
          pip install -r requirements.txt
          pip install -e .
      
      - name: Linting Check (Ruff)
        run: ruff check . --exclude legacy
        continue-on-error: true
      
      - name: Formatting Check (Black)
        run: black --check . --exclude legacy
        continue-on-error: true

      - name: Import Order Check (isort)
        run: isort --check-only .
        continue-on-error: true
      
      - name: Auto-Fix & Push
        if: failure()
        run: |
          echo "Linting/Formatting issues detected. Auto-fixing..."
          ruff check . --fix --exclude legacy || true
          isort .
          black . --exclude legacy
          
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-fix linting issues [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "Changes pushed. Workflow will restart."
          else
            echo "No changes needed for push."
          fi
      
      - name: Type Checking (MyPy)
        run: mypy --ignore-missing-imports --exclude legacy .

      - name: Run Performance Tests
        run: pytest --ignore=legacy/
