name: CI - Tests and Lint

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        env:
          COMET_DISABLE: "true"
        run: |
          pytest tests/ -v

      - name: Create issue on test failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const pythonVersion = '${{ matrix.python-version }}';
            
            const issueTitle = `Test Failure - Python ${pythonVersion} - ${new Date().toISOString().split('T')[0]}`;
            const issueBody = `## Test Failure Report
            
            **Workflow**: [View Run](${runUrl})
            **Python Version**: ${pythonVersion}
            **Timestamp**: ${new Date().toISOString()}
            
            ### Details
            
            Tests failed on Python ${pythonVersion}. Please review the workflow logs for details.
            
            ### Action Items
            
            - [ ] Review workflow logs
            - [ ] Check test output
            - [ ] Fix failing tests
            - [ ] Re-run workflow
            
            ### Workflow Information
            
            - **Branch**: ${context.ref}
            - **Commit**: ${context.sha.substring(0, 7)}
            - **Actor**: ${context.actor}
            
            ---
            
            *This issue was automatically created by the CI workflow.*`;
            
            // Check if similar issue already exists today
            const today = new Date().toISOString().split('T')[0];
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'test-failure',
              per_page: 10
            });
            
            const todayIssue = issues.data.find(issue => 
              issue.title.includes(today) && issue.title.includes(pythonVersion)
            );
            
            if (!todayIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: issueBody,
                labels: ['test-failure', 'automated', `python-${pythonVersion}`]
              });
              console.log('Issue created for test failure');
            } else {
              console.log('Issue already exists for today');
            }

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black ruff isort

      - name: Run Black
        run: black --check . || exit 1

      - name: Run Ruff
        run: ruff check . || exit 1

      - name: Run isort
        run: isort --check-only . || exit 1
      
      - name: Create issue on lint failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            
            const issueTitle = `Linting Failure - ${new Date().toISOString().split('T')[0]}`;
            const issueBody = `## Linting Failure Report
            
            **Workflow**: [View Run](${runUrl})
            **Timestamp**: ${new Date().toISOString()}
            
            ### Details
            
            Code linting checks failed. This may be due to:
            
            - **Black**: Code formatting issues
            - **Ruff**: Linting violations
            - **isort**: Import sorting issues
            
            ### Action Items
            
            - [ ] Review workflow logs for specific failures
            - [ ] Run linting tools locally to identify issues
            - [ ] Fix formatting and linting violations
            - [ ] Commit and push fixes
            - [ ] Re-run workflow
            
            ### Quick Fix
            
            Run these commands locally to auto-fix most issues:
            
            \`\`\`bash
            black .
            isort .
            ruff check --fix .
            \`\`\`
            
            ### Workflow Information
            
            - **Branch**: ${context.ref}
            - **Commit**: ${context.sha.substring(0, 7)}
            - **Actor**: ${context.actor}
            
            ---
            
            *This issue was automatically created by the CI workflow.*`;
            
            // Check if similar issue already exists today
            const today = new Date().toISOString().split('T')[0];
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'lint-failure',
              per_page: 10
            });
            
            const todayIssue = issues.data.find(issue => 
              issue.title.includes(today)
            );
            
            if (!todayIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: issueBody,
                labels: ['lint-failure', 'automated']
              });
              console.log('Issue created for lint failure');
            } else {
              console.log('Issue already exists for today');
            }
      
      - name: Create version tag on main branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          
          git fetch --tags
          
          LATEST_TAG=$(git tag -l "v*.*.*" | sort -V | tail -n 1)
          
          if [ -z "$LATEST_TAG" ]; then
            NEW_TAG="v4.1.0"
          else
            VERSION=${LATEST_TAG#v}
            MAJOR=$(echo $VERSION | cut -d. -f1)
            MINOR=$(echo $VERSION | cut -d. -f2)
            PATCH=$(echo $VERSION | cut -d. -f3)
            
            MINOR=$((MINOR + 1))
            PATCH=0
            
            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          fi
          
          echo "Creating new tag: $NEW_TAG"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG - Main branch update"
          git push origin "$NEW_TAG"
          
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV

  auto-fix:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black ruff isort

      - name: Auto-fix formatting
        run: |
          black .
          isort .
          ruff check --fix .

      - name: Commit and push fixes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          if ! git diff --quiet --cached; then
            git commit -m "Auto-fix formatting and linting [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
