name: MeridianFormer CI

on:
  push:
    branches: [main]
    paths:
      - 'meridian/**'
      - 'train.py'
      - 'requirements.txt'
  pull_request:
    branches: [main]

jobs:
  lint:
    name: "🔍 Lint & Format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linters
        run: pip install ruff black mypy

      - name: Check formatting
        run: black --check .

      - name: Lint
        run: ruff check .

  smoke-test:
    name: "🧪 Smoke Test"
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run smoke test
        env:
          SMOKE_TEST: '1'
          MAX_STEPS: '5'
          BATCH_SIZE: '2'
          BLOCK_SIZE: '64'
          PYTHONPATH: .
          PYTHONUNBUFFERED: '1'
        run: python train.py

      - name: Count parameters
        env:
          PYTHONPATH: .
        run: python scripts/count_params.py

  test:
    name: "✅ Unit Tests"
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest tests/ -v
