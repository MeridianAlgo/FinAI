name: Meridian Corpus

# Phase 2 of docs/BASE_MODEL_PLAN.md — train the finance tokenizer and pre-tokenize the
# corpus into uint16 shards.
#
# Manual only, and split into two jobs so the tokenizer can be reviewed before spending
# ~40 minutes tokenizing a corpus against it. A tokenizer change invalidates every shard.

on:
  workflow_dispatch:
    inputs:
      docs_per_dataset:
        description: 'Documents sampled per dataset for BPE training'
        type: string
        default: '20000'
      vocab_size:
        description: 'Tokenizer vocab size to keep'
        type: string
        default: '16384'
      vocab_sweep:
        description: 'Vocab sizes to compare (space separated)'
        type: string
        default: '8192 16384 32768'
      target_tokens:
        description: 'Training tokens to emit (0 skips shard building)'
        type: string
        default: '300000000'
      finance_ratio:
        description: 'Share of training tokens that should be finance text'
        type: string
        default: '0.65'
      max_epochs:
        description: 'Repetition cap for scarce finance sources'
        type: string
        default: '4'
      push_to_hub:
        description: 'Upload shards to the HF dataset repo'
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: meridian-corpus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tokenizer:
    name: "Train finance BPE"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch transformers tokenizers datasets numpy

      # Gate on this: a spec whose column does not exist yields zero rows silently, which
      # is how 14 of 27 datasets went unnoticed until the first corpus build.
      - name: Validate dataset specs
        env:
          PYTHONUNBUFFERED: '1'
          PYTHONPATH: .
        run: python scripts/validate_datasets.py --json docs/benchmarks/datasets.json

      - name: Train tokenizer
        env:
          PYTHONUNBUFFERED: '1'
          PYTHONPATH: .
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/build_tokenizer.py \
            --vocab-size ${{ github.event.inputs.vocab_size || '16384' }} \
            --docs-per-dataset ${{ github.event.inputs.docs_per_dataset || '40000' }} \
            --sweep ${{ github.event.inputs.vocab_sweep || '8192 16384 32768' }}

      - name: Upload tokenizer
        uses: actions/upload-artifact@v4
        with:
          name: meridian-tokenizer
          path: |
            tokenizer/
            docs/benchmarks/tokenizer.json

  shards:
    name: "Tokenize corpus to shards"
    needs: tokenizer
    if: github.event.inputs.target_tokens != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch transformers tokenizers datasets numpy huggingface_hub

      - name: Download tokenizer
        uses: actions/download-artifact@v4
        with:
          name: meridian-tokenizer

      - name: Build shards
        env:
          PYTHONUNBUFFERED: '1'
          PYTHONPATH: .
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          ARGS="--target-tokens ${{ github.event.inputs.target_tokens || '300000000' }}"
          ARGS="$ARGS --finance-ratio ${{ github.event.inputs.finance_ratio || '0.65' }}"
          ARGS="$ARGS --max-epochs ${{ github.event.inputs.max_epochs || '4' }}"
          if [ "${{ github.event.inputs.push_to_hub }}" = "true" ]; then
            ARGS="$ARGS --push-to-hub"
          fi
          python scripts/build_shards.py $ARGS

      - name: Upload manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-manifest
          path: corpus/manifest.json
          if-no-files-found: warn
