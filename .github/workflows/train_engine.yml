name: FinAI Training Engine

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      force_seed:
        description: 'Nuke and Re-seed HF Repo?'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seed:
    name: "Nuke & Seed HF"
    if: github.event.inputs.force_seed == 'true'
    runs-on: ubuntu-latest
    environment: HuggingFace Hub
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Critical Deps
        run: pip install huggingface_hub transformers torch datasets python-dotenv
      - name: Run Nuke & Seed
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PYTHONPATH: .
        run: python scripts/seed_hf_repo.py

  train:
    name: "Continuous Distributed Training"
    needs: seed
    if: |
      always() && 
      (needs.seed.result == 'success' || needs.seed.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Cache Python Dependencies
        uses: actions/cache@v4
        id: cache-deps
        with:
          path: |
            ~/.cache/pip
            ${{ env.pythonLocation }}
          key: ${{ runner.os }}-python-3.10-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-python-3.10-
      
      - name: Install Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black
      
      - name: Verify Dependencies (if cached)
        if: steps.cache-deps.outputs.cache-hit == 'true'
        run: |
          echo "✓ Using cached dependencies"
          pip list | head -20

      - name: Lint and Format
        run: |
          black .
          ruff check . --fix

      - name: Pull Model State
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import snapshot_download, list_repo_files
          import os, shutil
          
          repo_id = 'MeridianAlgo/FinAI-Lite'
          token = os.getenv('HF_TOKEN')
          
          try:
              files = list(list_repo_files(repo_id=repo_id, token=token))
              print(f'Found {len(files)} files in repo')
              
              # Check for checkpoint files
              checkpoint_files = [f for f in files if f.startswith('checkpoint/')]
              
              if checkpoint_files:
                  print(f'Checkpoint found with {len(checkpoint_files)} files! Pulling...')
                  
                  # Download entire repo to temp location
                  temp_dir = './temp_download'
                  snapshot_download(
                      repo_id=repo_id,
                      local_dir=temp_dir,
                      token=token
                  )
                  
                  # Move checkpoint folder to correct location
                  if os.path.exists(os.path.join(temp_dir, 'checkpoint')):
                      if os.path.exists('./checkpoint'):
                          shutil.rmtree('./checkpoint')
                      shutil.move(os.path.join(temp_dir, 'checkpoint'), './checkpoint')
                      print('✓ Checkpoint moved to ./checkpoint')
                  
                  # Verify critical files
                  critical_files = ['model.safetensors', 'trainer_state.pt', 'config.json']
                  for cf in critical_files:
                      path = os.path.join('./checkpoint', cf)
                      if os.path.exists(path):
                          size_mb = os.path.getsize(path) / (1024 * 1024)
                          print(f'  ✓ {cf} ({size_mb:.2f} MB)')
                      else:
                          print(f'  ✗ {cf} MISSING!')
                  
                  # Clean up temp
                  if os.path.exists(temp_dir):
                      shutil.rmtree(temp_dir)
                  
                  print('Checkpoint pulled successfully!')
              else:
                  print('No checkpoint found in repo. Starting fresh.')
          except Exception as e:
              print(f'Error pulling state: {e}')
              import traceback
              traceback.print_exc()
              print('Will start fresh.')
          "

      - name: Execute Training Loop
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          COMET_API_KEY: ${{ secrets.COMET_API_KEY }}
          MAX_STEPS: 200
          TOTAL_STEPS: 100000
          PYTHONPATH: .
        run: python train.py

      - name: Deploy to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import HfApi
          import os
          api = HfApi()
          print('Uploading checkpoint to MeridianAlgo/FinAI-Lite...')
          api.upload_folder(
              folder_path='./checkpoint',
              repo_id='MeridianAlgo/FinAI-Lite',
              path_in_repo='checkpoint',
              commit_message='Training checkpoint update via GitHub Engine [skip ci]',
              token=os.getenv('HF_TOKEN')
          )
          print('Deployment successful!')
          "

      - name: Upload Training State (GitHub Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: model-checkpoint
          path: checkpoint/
          retention-days: 1

      - name: Update Repository State
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --staged --quiet || git commit -m "chore: sync dataset state and lint fixes [skip ci]"
          git pull --rebase -X theirs origin main || (git rebase --abort && git pull --no-rebase origin main)
          git push origin main
