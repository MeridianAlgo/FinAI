name: Update Status Badges

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Update README with stats
      run: |
        # Read training state
        if [ -f training_state.json ]; then
          TOTAL_STEPS=$(jq -r '.total_steps' training_state.json)
          CYCLES=$(jq -r '.cycle_count' training_state.json)
          VERSION=$(jq -r '.version' training_state.json)
          LAST_RUN=$(jq -r '.last_run' training_state.json)
        else
          TOTAL_STEPS=0
          CYCLES=0
          VERSION="1.0.0"
          LAST_RUN="Never"
        fi
        
        # Update stats in README
        sed -i "s/TOTAL_STEPS_PLACEHOLDER/$TOTAL_STEPS/g" README.md
        sed -i "s/CYCLES_PLACEHOLDER/$CYCLES/g" README.md
        sed -i "s/VERSION_PLACEHOLDER/$VERSION/g" README.md
    
    - name: Commit changes
      run: |
        git config user.email "action@github.com"
        git config user.name "GitHub Action"
        git add README.md
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update status badges" && git push)
