name: Meridian.AI Lint

on:
  push:
    branches: [main]
    paths:
      - 'meridian/**'
      - 'train.py'
      - 'requirements.txt'
  pull_request:
    branches: [main]

jobs:
  lint:
    name: "Lint & Format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linters
        run: pip install ruff black mypy

      - name: Check formatting
        run: black --check .

      - name: Lint
        run: ruff check .
