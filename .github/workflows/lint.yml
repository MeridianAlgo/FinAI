name: Meridian.AI Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: "Lint & Format"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linters
        run: pip install ruff black mypy

      - name: Auto-format codes (Black)
        run: black .

      - name: Auto-lint codes (Ruff)
        run: ruff check . --fix

      - name: Commit and Push Changes
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git diff --staged --quiet || git commit -m "style: auto-format and lint [skip ci]"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git push https://$GH_PAT@github.com/MeridianAlgo/FinAI.git HEAD:${{ github.head_ref }}
          else
            git push https://$GH_PAT@github.com/MeridianAlgo/FinAI.git HEAD:main
          fi
